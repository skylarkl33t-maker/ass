<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Altıgen Rezonans</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0d14;color:#e8eef7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;inset:0;pointer-events:none;font-size:13px}
  .panel{background:rgba(10,14,22,.72);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:8px 10px}
  #top{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;min-width:340px}
  #roundTxt{font-weight:700;font-size:15px;letter-spacing:.5px}
  #coreBar{position:relative;height:18px;margin:6px 0 4px;background:#1b2230;border-radius:9px;overflow:hidden}
  #coreBar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#39d0ff,#7af7d0);transition:width .2s}
  #coreBar span{position:relative;font-size:12px;font-weight:700;line-height:18px;color:#04121c}
  #chainTxt{font-size:12px;color:#ffd76a}
  #resPanel{position:absolute;top:10px;left:10px;transition:transform .25s;transform-origin:top left}
  #resPanel.big{left:50%;top:92px;transform:translateX(-50%) scale(1.45);transform-origin:top center;background:rgba(10,14,22,.92)}
  #resPanel h4{margin:0 0 5px;font-size:12px;font-weight:700;letter-spacing:.4px}
  #resPanel table{border-collapse:separate;border-spacing:2px}
  #resPanel td,#resPanel th{padding:2px 5px;text-align:center;font-size:11px;border-radius:3px;white-space:nowrap}
  #resPanel td.nm{text-align:left;font-weight:600}
  #resPanel td.weak{background:#19d27a;color:#03170d;font-weight:800}
  #resPanel td.eff{background:#1f8a4d}
  #resPanel td.mid{background:#8a7a1f}
  #resPanel td.bad{background:#8a2a2a}
  #resPanel td.own{outline:2px solid #fff}
  #resPanel th.me{background:rgba(255,255,255,.22)}
  #resPanel tr.mine td.nm{color:#ffd76a}
  #resPanel .pr{display:inline-block;width:44px;height:7px;background:#1b2230;border-radius:4px;overflow:hidden;vertical-align:middle}
  #resPanel .pr i{display:block;height:100%;width:0;background:#ff5a4a}
  #resHint{margin-top:5px;font-size:11px;color:#b9c6da;max-width:330px;white-space:normal}
  #team{position:absolute;top:10px;right:10px;min-width:200px}
  #team .row{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px}
  #team .dot{width:10px;height:10px;border-radius:50%}
  #team .ub{flex:1;height:6px;background:#1b2230;border-radius:3px;overflow:hidden}
  #team .ub i{display:block;height:100%;background:#c58bff}
  #mini{position:absolute;right:10px;bottom:10px;border-radius:8px;background:rgba(10,14,22,.72);border:1px solid rgba(255,255,255,.12)}
  #bottom{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:stretch}
  .slot{min-width:118px;text-align:center}
  .slot b{display:block;font-size:10px;color:#8fa0ba;letter-spacing:.6px}
  .slot span{font-size:13px;font-weight:700}
  .slot small{display:block;color:#ffd76a;font-size:10px}
  #bars{min-width:230px}
  .bar{position:relative;height:12px;background:#1b2230;border-radius:6px;overflow:hidden;margin:3px 0}
  .bar i{position:absolute;left:0;top:0;bottom:0;width:0}
  .bar span{position:relative;display:block;font-size:10px;line-height:12px;text-align:center;font-weight:700;text-shadow:0 0 3px #000}
  #stam i{background:#7bd88f}
  #ult i{background:linear-gradient(90deg,#8a5bff,#ff7bd5)}
  #ult.full{box-shadow:0 0 10px #ff7bd5}
  #info{font-size:11px;color:#b9c6da;margin-top:3px;white-space:nowrap}
  #info b{color:#fff}
  #feed{position:absolute;left:10px;bottom:10px;width:330px;font-size:12px;line-height:1.5}
  #feed div{background:rgba(10,14,22,.6);padding:1px 6px;border-radius:4px;margin-top:2px;width:fit-content}
  #hint{position:absolute;left:50%;bottom:108px;transform:translateX(-50%);font-size:13px;font-weight:700;color:#ffd76a;text-shadow:0 0 4px #000}
  #banner{position:absolute;top:26%;left:0;right:0;text-align:center;font-size:40px;font-weight:800;letter-spacing:2px;text-shadow:0 0 14px #000;opacity:0;transition:opacity .3s}
  #comboBanner{position:absolute;top:60%;left:0;right:0;text-align:center;font-size:24px;font-weight:800;color:#ffd76a;text-shadow:0 0 10px #f60;opacity:0;transition:opacity .2s}
  #cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 3px #000}
  #popups{position:absolute;inset:0;overflow:hidden}
  .pop{position:absolute;left:0;top:0;font-weight:800;font-size:13px;text-shadow:0 0 3px #000,0 1px 2px #000;white-space:nowrap;display:none;will-change:transform,opacity}
  .pop.good{color:#8dffb0}.pop.bad{color:#9aa3b1;font-size:11px}.pop.combo{color:#ffd76a;font-size:17px}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,7,12,.82);pointer-events:auto}
  #overlay.hide{display:none}
  .box{max-width:860px;width:92%;text-align:center}
  .box h1{margin:0 0 6px;font-size:34px;letter-spacing:1px}
  .box p{color:#b9c6da;line-height:1.55;margin:6px 0}
  .keys{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 18px;text-align:left;margin:14px auto;max-width:620px;font-size:13px}
  .keys b{color:#ffd76a}
  button.go{pointer-events:auto;margin-top:12px;padding:12px 34px;font-size:17px;font-weight:800;border:0;border-radius:8px;background:#39d0ff;color:#04121c;cursor:pointer}
  .cards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .card{width:190px;padding:14px 12px;border-radius:10px;background:#141b29;border:2px solid #2b3850;cursor:pointer;text-align:center;transition:transform .12s,border-color .12s}
  .card:hover{transform:translateY(-5px);border-color:#39d0ff}
  .card .t{font-size:10px;letter-spacing:1px;color:#8fa0ba}
  .card .n{font-size:17px;font-weight:800;margin:6px 0}
  .card .d{font-size:12px;color:#b9c6da;min-height:48px}
  .card .a{margin-top:8px;font-size:11px;font-weight:800;color:#ffd76a}
  @media (max-width:900px){#resPanel{transform:scale(.8)}#team{display:none}#feed{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="top" class="panel"><div id="roundTxt">—</div><div id="coreBar"><i></i><span></span></div><div id="chainTxt"></div></div>
  <div id="resPanel" class="panel"></div>
  <div id="team" class="panel"></div>
  <canvas id="mini" width="180" height="180"></canvas>
  <div id="feed"></div>
  <div id="hint"></div>
  <div id="bottom">
    <div class="panel slot" id="sCore"><b>SİLAH ÇEKİRDEĞİ</b><span></span><small></small></div>
    <div class="panel slot" id="sMod"><b>MOD</b><span></span><small></small></div>
    <div class="panel slot" id="sPas"><b>PASİF</b><span></span><small></small></div>
    <div class="panel" id="bars">
      <div class="bar" id="stam"><i></i><span>STAMINA</span></div>
      <div class="bar" id="ult"><i></i><span>ULT</span></div>
      <div id="info"></div>
    </div>
  </div>
  <div id="banner"></div>
  <div id="comboBanner"></div>
  <div id="cross"></div>
  <div id="popups"></div>
  <div id="overlay"><div class="box" id="ovBox"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ============================================================================
   ALTIGEN REZONANS — tek dosyalık co-op alan savunması prototipi
   Bölümler: 1 Config/Data · 2 Wave+Resistance Generator · 3 Entities (+pool)
             4 Combat+Combo · 5 Bot AI · 6 Camera/Input · 7 UI/HUD · 8 Game loop
   ========================================================================== */

/* ============================ 1. CONFIG / DATA ============================ */
const CFG = {
  arena:   { R: 70, coreR: 5, ringR: 17, spawnR: 66, postR: 28, laneHalfW: 12, heroMaxR: 58 },
  core:    { hp: 100 },
  rounds:  10, bossRounds: [5, 10], prepTime: 8,
  player:  { walk: 7.5, sprint: 12.5, stamina: 100, staminaDrain: 20, staminaRegen: 14,
             towers: 3, foreignTowerLimit: 2, towerMinR: 9, towerMaxR: 56 },
  resist:  { ownPenalty: 0.6, ownPenaltyChance: 0.8, effectiveMax: 0.3, minEffective: 2,
             themedBonus: 0.1, weakChance: 0.5, weak: -0.25 },
  infusion:{ dur: 25, range: 9, giverBuff: 0.25, cdPlayer: 12, cdBot: 26 },
  combo:   { window: 2.0, icd: 0.9, splash: 0.7 },
  essence: { perKill: 1, cap: 20, ultPer: 10, selfUlt: 2 },
  ult:     { need: 100, radius: 16, dmg: 150 },
  wave:    { baseCount: 8, countPer: 3, baseHp: 60, hpGrowth: 1.34, spawnWindow: 24, speed: 3.2 },
  flawless:{ dmgPerChain: 0.08, maxChain: 5, extraCards: 1 },
  bot:     { thinkEvery: 0.8, pressMin: 6, pressRatio: 1.3, helpStay: 6, pingStay: 9, essenceSendAt: 5, maxHelpers: 1 },
  tower:   { dmg: 9, rate: 1.4, range: 24, speed: 60, turn: 5 },
  pools:   { creeps: 300, proj: 360, fx: 56, beams: 64, popups: 40 },
};

const ELEMENTS = {
  FIRE:      { name: 'Ateş',     color: 0xff5a2a, icon: '🔥' },
  WATER:     { name: 'Su',       color: 0x3aa0ff, icon: '💧' },
  EARTH:     { name: 'Toprak',   color: 0xc08a45, icon: '⛰️' },
  AIR:       { name: 'Hava',     color: 0xbdf3f7, icon: '🌪️' },
  LIGHTNING: { name: 'Yıldırım', color: 0xffe23a, icon: '⚡' },
  POISON:    { name: 'Zehir',    color: 0x7ddc3a, icon: '☠️' },
};
const EL_KEYS = Object.keys(ELEMENTS);

/* Rezonans kombo tablosu. mult: tetikleyen vuruşun taban hasarı çarpanı (dirençten bağımsız).
   aoe: yarıçap · chain: sıçrama sayısı · slow/slowDur · stun(sn) · dot(kombo hasarı/sn oranı)/dotDur · vuln(sn, +%30 hasar) */
const COMBOS = {
  'FIRE+WATER':       { name: 'Buhar Patlaması', mult: 2.4, aoe: 7 },
  'WATER+LIGHTNING':  { name: 'İletim',          mult: 2.0, chain: 4 },
  'EARTH+AIR':        { name: 'Kum Fırtınası',   mult: 1.6, aoe: 8, slow: 0.55, slowDur: 3.5 },
  'FIRE+POISON':      { name: 'Toksik Alev',     mult: 1.8, dot: 0.9, dotDur: 4 },
  'FIRE+EARTH':       { name: 'Magma',           mult: 2.2, aoe: 5, slow: 0.3, slowDur: 2 },
  'FIRE+AIR':         { name: 'Alev Girdabı',    mult: 2.0, aoe: 9 },
  'FIRE+LIGHTNING':   { name: 'Plazma',          mult: 3.4 },
  'WATER+EARTH':      { name: 'Bataklık',        mult: 1.5, aoe: 6, slow: 0.7, slowDur: 3 },
  'WATER+AIR':        { name: 'Buz Fırtınası',   mult: 1.7, aoe: 5, stun: 1.3 },
  'WATER+POISON':     { name: 'Asit Yağmuru',    mult: 1.6, aoe: 6, vuln: 5 },
  'EARTH+LIGHTNING':  { name: 'Manyetik Şok',    mult: 2.0, stun: 1.6 },
  'EARTH+POISON':     { name: 'Çürüme',          mult: 1.6, dot: 0.6, dotDur: 4, vuln: 4 },
  'AIR+LIGHTNING':    { name: 'Fırtına',         mult: 1.8, chain: 5 },
  'AIR+POISON':       { name: 'Zehir Bulutu',    mult: 1.5, aoe: 8, dot: 0.5, dotDur: 4 },
  'LIGHTNING+POISON': { name: 'Nörotoksin',      mult: 1.9, stun: 1.0, dot: 0.6, dotDur: 3 },
};
const comboKey = (a, b) => EL_KEYS.indexOf(a) < EL_KEYS.indexOf(b) ? a + '+' + b : b + '+' + a;

/* Silah çekirdekleri. kind: proj | beam | chain */
const CORES = {
  single:  { name: 'Tek Hedef', kind: 'proj',  dmg: 14,  rate: 2.6, range: 36, speed: 70, desc: 'Hızlı, isabetli tek mermi.' },
  arc:     { name: 'Yay AoE',   kind: 'proj',  dmg: 17,  rate: 1.1, range: 34, speed: 40, aoe: 5.5, desc: 'Çarptığı yerde alan hasarı (%60 sıçrama).' },
  beam:    { name: 'Işın',      kind: 'beam',  dmg: 4.2, rate: 9,   range: 30, desc: 'Kesintisiz ışın, çok sık vuruş.' },
  chain:   { name: 'Zincir',    kind: 'chain', dmg: 13,  rate: 1.5, range: 30, jumps: 3, falloff: 0.75, jumpR: 10, desc: '3 hedefe sıçrayan şimşek.' },
  scatter: { name: 'Saçma',     kind: 'proj',  dmg: 6,   rate: 1.5, range: 20, speed: 60, pellets: 6, spread: 0.5, desc: 'Yakın mesafe 6 saçma.' },
};
/* Modlar. Seviye başına sayısal değerler ölçeklenir (bkz. calcStats). */
const MODS = {
  pierce:   { name: 'Delici',      pierce: 2, desc: 'Mermi 2 hedefi deler (ışın: hat boyunca, zincir: +sıçrama).' },
  ricochet: { name: 'Sekme',       bounce: 2, desc: 'Vuruş 2 kez yakın hedefe seker.' },
  multi:    { name: 'Çoklu Atış',  extra: 2, extraEff: 0.33, desc: '+2 mermi/hedef, mermi başı hasar düşer (toplam +%65).' },
  dot:      { name: 'Yakıcı (DoT)',dotPct: 0.5, dotDur: 3, desc: '3 sn boyunca vuruşun %50\'si/sn ek hasar.' },
  slow:     { name: 'Yavaşlatma',  slow: 0.35, slowDur: 1.5, desc: 'Vurulan hedef %35 yavaşlar.' },
  homing:   { name: 'Güdümlü',     turn: 6, rangeMul: 1.2, desc: 'Mermiler hedefi takip eder, menzil +%20.' },
};
/* Pasifler. Değerler seviye ile çarpılır. */
const PASSIVES = {
  power:     { name: 'Güç',        dmg: 0.2,  desc: 'Hasar +%20 / sv.' },
  haste:     { name: 'Çabukluk',   rate: 0.18, desc: 'Atış hızı +%18 / sv.' },
  reach:     { name: 'Uzun Menzil',range: 0.2, desc: 'Menzil +%20 / sv.' },
  harvest:   { name: 'Hasatçı',    essence: 1.0, desc: 'Öldürme başına +1 öz / sv.' },
  engineer:  { name: 'Mühendis',   towers: 1, towerDmg: 0.25, desc: '+1 kule ve kule hasarı +%25 / sv.' },
  resonator: { name: 'Rezonatör',  combo: 0.35, desc: 'Kombo hasarı +%35 / sv.' },
  conduit:   { name: 'İletken',    infDur: 10, infBuff: 0.15, desc: 'Aşılama +10 sn, veren buff\'ı +%15 / sv.' },
  athlete:   { name: 'Atlet',      stamina: 0.5, speed: 0.1, desc: 'Stamina +%50, hız +%10 / sv.' },
};
const LVL = { coreDmg: 0.22, mod: 0.5, modSlow: 0.25 };   // seviye başı ölçekler

const CREEPS = {
  grunt:  { hp: 1,   speed: 1,    leak: 1,  radius: 0.9, essence: 1,  scale: 1 },
  runner: { hp: 0.6, speed: 1.6,  leak: 1,  radius: 0.8, essence: 1,  scale: 0.85 },
  tank:   { hp: 2.6, speed: 0.7,  leak: 2,  radius: 1.2, essence: 2,  scale: 1 },
  boss:   { hp: 32,  speed: 0.5,  leak: 30, radius: 3.0, essence: 15, scale: 3.2 },
};

/* ------------------------------ yardımcılar ------------------------------ */
const TAU = Math.PI * 2, SEC = TAU / 6;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const laneAng = i => (i + 0.5) * SEC;
const laneDir = i => [Math.sin(laneAng(i)), Math.cos(laneAng(i))];
function sectorOf(x, z) { let a = Math.atan2(x, z); if (a < 0) a += TAU; return Math.min(5, Math.floor(a / SEC)); }
const QS = new URLSearchParams(location.search);
const AUTO = QS.has('auto');              // ?auto → insan oyuncuyu da bot oynar (denge testi)

/* ------------------------------- oyun durumu ----------------------------- */
const G = {
  state: 'menu', round: 0, time: 0, stateT: 0, waveT: 0,
  coreHp: CFG.core.hp, chain: 0, roundLeaks: 0, extraCard: false,
  players: [], human: null, towers: [], creeps: [], projs: [], fxs: [], beams: [],
  resist: [], spawnQ: [], pressure: [0, 0, 0, 0, 0, 0], helpers: [0, 0, 0, 0, 0, 0],
  ping: null, autoFire: true, roundHp: 30,
  stats: { combos: 0, infusions: 0, flawless: 0, leaks: 0 },
};

/* ===================== 2. WAVE + RESISTANCE GENERATOR ===================== */
function countEffective(row) { let n = 0; for (const k of EL_KEYS) if (row[k] < CFG.resist.effectiveMax) n++; return n; }

/* Her kenar için {element: direnç} satırı üretir.
   - Kenar sahibinin elementi çoğu turda ownPenalty (%60) dirençle karşılanır.
   - Denge kuralı: her kenarda en az minEffective (2) element < %30 direnç. */
function genResistance() {
  const R = CFG.resist, map = [];
  const r5 = v => Math.round(v * 20) / 20;
  for (let e = 0; e < 6; e++) {
    const own = G.players[e].el;
    let row, tries = 0;
    do {
      row = {};
      const penal = Math.random() < R.ownPenaltyChance;
      row[own] = penal ? R.ownPenalty + (Math.random() < 0.5 ? R.themedBonus : 0) : r5(rand(0.1, 0.5));
      const others = shuffle(EL_KEYS.filter(k => k !== own));
      const nEff = R.minEffective + (Math.random() < 0.4 ? 1 : 0);
      others.forEach((k, i) => {
        if (i < nEff) row[k] = (i === 0 && Math.random() < R.weakChance) ? R.weak : r5(rand(0, 0.25));
        else row[k] = r5(rand(0.35, 0.75));
      });
    } while (countEffective(row) < R.minEffective && ++tries < 20);
    map.push(row);
  }
  return map;
}

function genWave(round) {
  const W = CFG.wave, q = [], n = Math.round(W.baseCount + W.countPer * round);
  for (let e = 0; e < 6; e++) for (let i = 0; i < n; i++) {
    const r = Math.random();
    let type = 'grunt';
    if (round >= 3 && r < 0.12 + round * 0.012) type = 'tank';
    else if (round >= 2 && r < 0.4) type = 'runner';
    q.push({ t: 1 + (i / n) * W.spawnWindow * (1 + round * 0.03) + Math.random() * 1.5, lane: e, type });
  }
  if (CFG.bossRounds.includes(round)) {
    const l = Math.random() * 6 | 0;
    (round >= CFG.rounds ? [l, (l + 3) % 6] : [l]).forEach(x => q.push({ t: 8, lane: x, type: 'boss' }));
  }
  q.sort((a, b) => b.t - a.t);            // sondan pop edilir
  return q;
}

/* ============================== 3. ENTITIES =============================== */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0d14);
scene.fog = new THREE.Fog(0x0a0d14, 90, 210);
const camera = new THREE.PerspectiveCamera(62, 1, 0.3, 400);
scene.add(new THREE.HemisphereLight(0xbfd6ff, 0x1a1410, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(40, 80, 20); scene.add(sun);

const mat = (color, emissive) => new THREE.MeshPhongMaterial({ color, emissive: emissive || 0x000000, flatShading: true, shininess: 10 });
const glow = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity: opacity == null ? 1 : opacity, depthWrite: false, blending: THREE.AdditiveBlending });

const GEO = {
  grunt: new THREE.OctahedronGeometry(0.95), runner: new THREE.TetrahedronGeometry(1.0),
  tank: new THREE.BoxGeometry(1.6, 1.6, 1.6), boss: new THREE.IcosahedronGeometry(1, 0),
  bar: new THREE.PlaneGeometry(1.8, 0.2), proj: new THREE.IcosahedronGeometry(0.35, 0),
  fx: new THREE.SphereGeometry(1, 12, 6), beam: new THREE.BoxGeometry(1, 1, 1),
  body: new THREE.CylinderGeometry(0.45, 0.8, 1.8, 6), head: new THREE.IcosahedronGeometry(0.45, 0),
  ring: new THREE.TorusGeometry(1.1, 0.12, 4, 14), aura: new THREE.TorusGeometry(1.7, 0.16, 4, 16),
  tBase: new THREE.CylinderGeometry(0.7, 1.0, 2.2, 6), tTop: new THREE.OctahedronGeometry(0.7),
};
const ELMAT = {}; EL_KEYS.forEach(k => ELMAT[k] = new THREE.MeshBasicMaterial({ color: ELEMENTS[k].color }));
const BARMAT = new THREE.MeshBasicMaterial({ color: 0x6dff8a, depthTest: false });

class Pool {
  constructor(n, make) { this.free = []; for (let i = 0; i < n; i++) this.free.push(make(i)); }
  get() { return this.free.pop() || null; }
  put(o) { this.free.push(o); }
}

function makeLabel(text, color) {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64;
  const g = cv.getContext('2d'); g.font = 'bold 34px system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';

/* ============================ 4. COMBAT + COMBO =========================== */
function nearestCreep(x, z, maxR, exclude) {
  let best = null, bd = maxR * maxR;
  for (const c of G.creeps) { if (!c.active || (exclude && exclude.includes(c))) continue; const dx = c.x - x, dz = c.z - z, d = dx * dx + dz * dz; if (d < bd) { bd = d; best = c; } }
  return best;
}
function mostAdvanced(x, z, maxR) {        // menzildeki, çekirdeğe en yakın yaratık
  let best = null, bd = 1e9; const r2 = maxR * maxR;
  for (const c of G.creeps) { if (!c.active) continue; const dx = c.x - x, dz = c.z - z; if (dx * dx + dz * dz < r2 && c.d < bd) { bd = c.d; best = c; } }

}
function addSlow(c, f, dur) { if (c.slowT <= 0) c.slowF = 0; c.slowF = Math.max(c.slowF, f); c.slowT = Math.max(c.slowT, dur); }

function damageCreep(owner, c, d, el, label) {

  if (label) popup(c.x, c.h + 0.6, c.z, label + ' ' + Math.round(d), 'combo');
  else if (owner === G.human) { c.popAcc += d; c.popEl = el; }

}
function killCreep(owner, c) {

  owner.ult = Math.min(CFG.ult.need, owner.ult + CFG.essence.selfUlt * c.ess);

    if (fx.slow > 0) addSlow(c, fx.slow * (c.type === 'boss' ? 0.5 : 1), fx.slowDur);

/* ---------------------------- hero silah ateşi ---------------------------- */

/* ================================ 5. BOT AI =============================== */

/* ============================ 6. CAMERA / INPUT =========================== */
/* Soyut girdi katmanı: oyun yalnızca Input'u okur. Masaüstü kaynağı aşağıda; mobil için aynı alanları

    else if (a === 'ping') { const g = aimGroundPoint(); createPing(g.x, g.z); }
    else if (a === 'auto') { G.autoFire = !G.autoFire; feed('Otomatik ateş: <b>' + (G.autoFire ? 'AÇIK' : 'KAPALI') + '</b>'); }
    if (err) feed('<span style="color:#ff9a8a">' + err + '</span>');
  }
  p.cd -= dt;
  if (p.cd <= 0 && (Input.fire || G.autoFire)) {
    const range = heroRange(p), t = (Input.fire && aimTarget(p, range)) || nearestCreep(p.x, p.z, range);
    if (t) { fireHero(p, t); p.cd = 1 / (CORES[p.build.core].rate * p.stats.rate); }
  }
}
function updateHeroCommon(p, dt) {
  if (p.infT > 0 && (p.infT -= dt) <= 0) p.aura.visible = false;
  if (p.buffT > 0) p.buffT -= dt; if (p.infCd > 0) p.infCd -= dt;
  p.mesh.position.set(p.x, 0, p.z); p.mesh.rotation.y = p.faceYaw;
  if (p.aura.visible) p.aura.rotation.z += dt * 3;
}
function updateTowers(dt) {
  const T = CFG.tower;
  for (const t of G.towers) {
    if (t.infT > 0 && (t.infT -= dt) <= 0) t.aura.visible = false;
    t.top.rotation.y += dt * 2;
    if ((t.cd -= dt) > 0) continue;
    const c = mostAdvanced(t.x, t.z, T.range); if (!c) { t.cd = 0.15; continue; }
    const o = t.owner, el = shotEl(t, o.el), dx = c.x - t.x, dz = c.z - t.z, d = Math.hypot(dx, dz) || 1;
    spawnProj(o, t.x, t.z, dx / d, dz / d, T.speed, T.dmg * o.stats.dmg * o.stats.towerDmg * dmgMult(o), el, T.range / T.speed * 1.4, { turn: T.turn, target: c, small: true });
    t.cd = 1 / T.rate;
  }
}
function updateFx(dt) {
  for (let i = G.fxs.length - 1; i >= 0; i--) {
    const f = G.fxs[i]; f.t += dt; const k = f.t / f.life;
    if (k >= 1) { f.mesh.visible = false; fxPool.put(f); G.fxs[i] = G.fxs[G.fxs.length - 1]; G.fxs.pop(); continue; }
    if (f.orb) { const o = f.orb; f.mesh.position.set(o.fx + (o.to.x - o.fx) * k, 2 + Math.sin(k * Math.PI) * 4, o.fz + (o.to.z - o.fz) * k); }
    else { f.mesh.scale.setScalar(Math.max(0.1, f.r * (0.3 + 0.7 * k))); f.mesh.material.opacity = 0.55 * (1 - k); }
  }
  for (let i = G.beams.length - 1; i >= 0; i--) {
    const b = G.beams[i]; b.t -= dt;
    if (b.t <= 0) { b.mesh.visible = false; beamPool.put(b); G.beams[i] = G.beams[G.beams.length - 1]; G.beams.pop(); } else b.mesh.material.opacity = b.t / 0.12;
  }
}

/* ================================ 7. UI / HUD ============================== */
const $ = id => document.getElementById(id);
const UI = {
  slowT: 0, bannerT: 0, comboT: 0, mapBigUntil: 0, feedItems: [],
  popPool: null, pops: [],
  init() {
    const root = $('popups');
    this.popPool = new Pool(CFG.pools.popups, () => { const el = document.createElement('div'); el.className = 'pop'; root.appendChild(el); return { el }; });
    this.mini = $('mini').getContext('2d');
  },
  buildResist() {
    const me = G.human; let h = '<h4>DİRENÇ HARİTASI — Tur ' + G.round + ' <span style="font-weight:400;color:#8fa0ba">(Tab: büyüt)</span></h4><table><tr><th></th>';
    for (const k of EL_KEYS) h += '<th class="' + (k === me.el ? 'me' : '') + '">' + ELEMENTS[k].icon + '</th>';
    h += '<th>baskı</th></tr>';
    for (let e = 0; e < 6; e++) {
      const p = G.players[e], row = G.resist[e];
      h += '<tr class="' + (p === me ? 'mine' : '') + '"><td class="nm">' + ELEMENTS[p.el].icon + ' ' + p.name + '</td>';
      for (const k of EL_KEYS) { const r = row[k], cls = r < 0 ? 'weak' : r < CFG.resist.effectiveMax ? 'eff' : r < 0.6 ? 'mid' : 'bad'; h += '<td class="' + cls + (k === p.el ? ' own' : '') + '">' + (r < 0 ? '+' + Math.round(-r * 100) : Math.round(r * 100)) + '%</td>'; }
      h += '<td><span class="pr"><i id="pr' + e + '"></i></span></td></tr>';
    }
    const good = []; for (let e = 0; e < 6; e++) if (G.resist[e][me.el] < CFG.resist.effectiveMax) good.push(G.players[e].name);
    h += '</table><div id="resHint">Hücre = o kenardaki dalganın elemente direnci. Yeşil: etkili · Kırmızı: dirençli · Beyaz çerçeve: kenar sahibinin elementi.<br>' +
      'Senin elementin ' + ELEMENTS[me.el].icon + ' şu kenarlarda etkili: <b style="color:#8dffb0">' + (good.join(', ') || '—') + '</b> → oraya kule koy / sahibini aşıla.</div>';
    $('resPanel').innerHTML = h;
  },
  slots() {
    const b = G.human.build, set = (id, n, l) => { const e = $(id); e.children[1].textContent = n; e.children[2].textContent = l; };
    set('sCore', CORES[b.core].name, 'Lv ' + b.coreLvl);
    set('sMod', b.mod ? MODS[b.mod].name : '—', b.mod ? 'Lv ' + b.modLvl : 'boş');
    set('sPas', b.passive ? PASSIVES[b.passive].name : '—', b.passive ? 'Lv ' + b.passiveLvl : 'boş');
  },
  slow() {
    const p = G.human;
    $('roundTxt').textContent = 'TUR ' + G.round + ' / ' + CFG.rounds + (G.state === 'prep' ? '  ·  hazırlık ' + Math.ceil(CFG.prepTime - G.stateT) + ' sn' : '  ·  kalan yaratık ' + (G.creeps.length + G.spawnQ.length));
    $('coreBar').firstElementChild.style.width = (G.coreHp / CFG.core.hp * 100) + '%';
    $('coreBar').lastElementChild.textContent = 'ORTAK ÇEKİRDEK ' + Math.ceil(G.coreHp) + ' / ' + CFG.core.hp;
    $('chainTxt').textContent = G.chain > 0 ? '★ Kusursuz zincir x' + G.chain + '  →  takım hasarı +%' + Math.round(G.chain * CFG.flawless.dmgPerChain * 100) : (G.state === 'wave' && G.roundLeaks === 0 ? 'Bu tur şimdilik kusursuz' : '');
    for (let e = 0; e < 6; e++) { const el = $('pr' + e); if (el) el.style.width = Math.min(100, G.pressure[e] / 24 * 100) + '%'; }
    let h = '';
    for (const o of G.players) h += '<div class="row"><span class="dot" style="background:' + hex(ELEMENTS[o.el].color) + '"></span><span style="width:54px;' + (o === p ? 'color:#ffd76a;font-weight:700' : '') + '">' + o.name + '</span>' +
      '<span style="width:20px">' + (o.infT > 0 ? ELEMENTS[o.infEl].icon : '') + '</span><span class="ub"><i style="width:' + o.ult + '%"></i></span><span style="width:34px;text-align:right">✦' + Math.floor(o.essence) + '</span></div>';
    $('team').innerHTML = h;
    const f = findInfuseTarget(p);
    $('hint').textContent = f && p.infCd <= 0 ? '[E] ' + f.player.name + (f.tower ? ' kulesini' : '’i') + ' aşıla (' + ELEMENTS[p.el].name + ')' : (p.ult >= CFG.ult.need ? '[F] ULT HAZIR' : '');
    $('info').innerHTML = '✦ Öz <b>' + Math.floor(p.essence) + '</b> [Q] · Kule <b>' + p.towers.length + '/' + p.stats.towers + '</b> [R] · Aşı <b>' + (p.infCd > 0 ? Math.ceil(p.infCd) + ' sn' : 'hazır') + '</b> [E]' +
      (p.infT > 0 ? ' · Aşılı ' + ELEMENTS[p.infEl].icon + ' ' + Math.ceil(p.infT) + 's' : '') + (p.buffT > 0 ? ' · <b style="color:#8dffb0">+hasar ' + Math.ceil(p.buffT) + 's</b>' : '') + ' · Oto [T] ' + (G.autoFire ? 'açık' : 'kapalı');
    this.drawMini();
  },
  frame(dt) {
    const p = G.human, maxSt = CFG.player.stamina * p.stats.stamina;
    $('stam').firstElementChild.style.width = (p.stamina / maxSt * 100) + '%';
    $('ult').firstElementChild.style.width = p.ult + '%'; $('ult').className = 'bar' + (p.ult >= CFG.ult.need ? ' full' : '');
    if ((this.slowT -= dt) <= 0) { this.slowT = 0.2; this.slow(); }
    if (this.bannerT > 0 && (this.bannerT -= dt) <= 0) $('banner').style.opacity = 0;
    if (this.comboT > 0 && (this.comboT -= dt) <= 0) $('comboBanner').style.opacity = 0;
    $('resPanel').classList.toggle('big', G.time < this.mapBigUntil);
    const W = innerWidth, H = innerHeight;
    for (let i = this.pops.length - 1; i >= 0; i--) {
      const o = this.pops[i]; o.t += dt;
      if (o.t >= o.life) { o.el.style.display = 'none'; this.popPool.put(o); this.pops[i] = this.pops[this.pops.length - 1]; this.pops.pop(); continue; }
      _v.set(o.x, o.y + o.t * 2.2, o.z).project(camera);
      if (_v.z > 1 || _v.z < -1) { o.el.style.opacity = 0; continue; }
      o.el.style.opacity = 1 - (o.t / o.life) ** 2;
      o.el.style.transform = 'translate(' + ((_v.x * 0.5 + 0.5) * W | 0) + 'px,' + ((-_v.y * 0.5 + 0.5) * H | 0) + 'px) translate(-50%,-50%)';
    }
  },
  drawMini() {
    const g = this.mini, S = 180, c = S / 2, k = 82 / CFG.arena.R, X = x => c + x * k, Y = z => c - z * k;
    g.clearRect(0, 0, S, S);
    for (let e = 0; e < 6; e++) {
      const a0 = e * SEC, a1 = (e + 1) * SEC, R = CFG.arena.R;
      g.beginPath(); g.moveTo(c, c); g.lineTo(X(Math.sin(a0) * R), Y(Math.cos(a0) * R)); g.lineTo(X(Math.sin(a1) * R), Y(Math.cos(a1) * R)); g.closePath();
      g.fillStyle = 'rgba(255,70,60,' + Math.min(0.55, G.pressure[e] / 40) + ')'; g.fill(); g.strokeStyle = hex(ELEMENTS[G.players[e].el].color); g.lineWidth = 1; g.stroke();
    }
    g.fillStyle = '#ff7a6a'; for (const cr of G.creeps) if (cr.active) { const s = cr.type === 'boss' ? 6 : 2; g.fillRect(X(cr.x) - s / 2, Y(cr.z) - s / 2, s, s); }
    for (const t of G.towers) { g.fillStyle = hex(ELEMENTS[t.owner.el].color); g.fillRect(X(t.x) - 2, Y(t.z) - 2, 4, 4); }
    for (const p of G.players) { g.beginPath(); g.arc(X(p.x), Y(p.z), p === G.human ? 5 : 3.5, 0, TAU); g.fillStyle = hex(ELEMENTS[p.el].color); g.fill(); if (p === G.human) { g.strokeStyle = '#fff'; g.lineWidth = 2; g.stroke(); g.beginPath(); g.moveTo(X(p.x), Y(p.z)); g.lineTo(X(p.x + Math.sin(Cam.yaw) * 12), Y(p.z + Math.cos(Cam.yaw) * 12)); g.stroke(); } }
    if (G.ping) { g.strokeStyle = '#ffd76a'; g.lineWidth = 2; g.beginPath(); g.arc(X(G.ping.x), Y(G.ping.z), 6, 0, TAU); g.stroke(); }
    g.fillStyle = '#39d0ff'; g.beginPath(); g.arc(c, c, 4, 0, TAU); g.fill();
  },
};
function popup(x, y, z, text, cls) {
  let o = UI.popPool.get();
  if (!o) { if (cls !== 'combo') return; o = UI.pops.shift(); if (!o) return; }
  o.x = x; o.y = y; o.z = z; o.t = 0; o.life = cls === 'combo' ? 1.3 : 0.7;
  o.el.textContent = text; o.el.className = 'pop ' + (cls || ''); o.el.style.display = 'block'; o.el.style.opacity = 0; UI.pops.push(o);
}
function feed(html) {
  const f = $('feed'), d = document.createElement('div'); d.innerHTML = html; f.appendChild(d);
  while (f.children.length > 6) f.removeChild(f.firstChild);
  setTimeout(() => { if (d.parentNode) d.parentNode.removeChild(d); }, 9000);
}
function banner(text, color) { const b = $('banner'); b.textContent = text; b.style.color = color || '#fff'; b.style.opacity = 1; UI.bannerT = 2.6; }
function comboBanner(text) { const b = $('comboBanner'); b.textContent = '⟡ ' + text; b.style.opacity = 1; UI.comboT = 0.9; }

/* --------------------------------- draft ---------------------------------- */
const SLOT_T = { core: ['SİLAH ÇEKİRDEĞİ', CORES], mod: ['MOD', MODS], passive: ['PASİF', PASSIVES] };
function genCards(p, n) {
  const b = p.build, pool = [], out = [{ slot: 'core', id: b.core }];     // en az bir yükseltme garantili
  for (const s in SLOT_T) for (const id in SLOT_T[s][1]) pool.push({ slot: s, id });
  shuffle(pool);
  for (const c of pool) { if (out.length >= n) break; if (!out.some(o => o.slot === c.slot && o.id === c.id)) out.push(c); }
  return shuffle(out);
}
function applyCard(p, c) { const b = p.build; if (b[c.slot] === c.id) b[c.slot + 'Lvl']++; else b[c.slot] = c.id; calcStats(p); }
let draftCards = null;
function openDraft() {
  G.state = 'draft'; if (document.exitPointerLock) document.exitPointerLock();
  for (const p of G.players) if (p.isBot) botDraft(p);
  if (AUTO) { closeDraft(); return; }
  const n = 3 + (G.extraCard ? CFG.flawless.extraCards : 0), b = G.human.build;
  draftCards = genCards(G.human, n);
  let h = '<h1>Tur ' + G.round + ' tamamlandı</h1><p>' + (G.extraCard ? '<b style="color:#ffd76a">KUSURSUZ TUR!</b> Ekstra kart + zincir x' + G.chain + ' (takım hasarı +%' + Math.round(G.chain * CFG.flawless.dmgPerChain * 100) + ')' : 'Bu tur ' + G.roundLeaks + ' sızıntı oldu — zincir sıfırlandı.') + '</p><p>Bir kart seç (tıkla ya da 1–' + n + '):</p><div class="cards">';
  draftCards.forEach((c, i) => {
    const d = SLOT_T[c.slot][1][c.id], cur = b[c.slot], up = cur === c.id;
    h += '<div class="card" data-i="' + i + '"><div class="t">' + SLOT_T[c.slot][0] + '</div><div class="n">' + d.name + '</div><div class="d">' + d.desc + '</div><div class="a">' +
      (up ? 'YÜKSELT → Lv ' + (b[c.slot + 'Lvl'] + 1) : cur ? 'DEĞİŞTİR (' + SLOT_T[c.slot][1][cur].name + ' yerine, seviye korunur)' : 'YENİ') + '</div></div>';
  });
  showOverlay(h + '</div>');
  document.querySelectorAll('.card').forEach(el => el.onclick = () => pickCard(+el.dataset.i));
}
function pickCard(i) { if (G.state !== 'draft' || !draftCards || !draftCards[i]) return; applyCard(G.human, draftCards[i]); draftCards = null; closeDraft(); }
function closeDraft() { hideOverlay(); UI.slots(); lockPointer(); startRound(G.round + 1); }
function showOverlay(html) { $('ovBox').innerHTML = html; $('overlay').classList.remove('hide'); }
function hideOverlay() { $('overlay').classList.add('hide'); }

/* =============================== 8. GAME LOOP ============================== */
function startRound(n) {
  G.round = n; G.state = 'prep'; G.stateT = 0; G.roundLeaks = 0; G.waveT = 0; G.helpers.fill(0);
  G.roundHp = CFG.wave.baseHp * Math.pow(CFG.wave.hpGrowth, n - 1);
  G.resist = genResistance(); G.spawnQ = genWave(n);
  for (const p of G.players) if (p.isBot) botRelease(p);
  botPlaceTowers();
  UI.buildResist(); UI.mapBigUntil = G.time + 5.5;
  banner('TUR ' + n + (CFG.bossRounds.includes(n) ? ' — BOSS' : ''), CFG.bossRounds.includes(n) ? '#ff6a5a' : '#fff');
}
function endRound() {
  const flawless = G.roundLeaks === 0;
  if (flawless) { G.chain = Math.min(CFG.flawless.maxChain, G.chain + 1); G.stats.flawless++; } else G.chain = 0;
  G.extraCard = flawless;
  if (G.round >= CFG.rounds) return endGame(true);
  openDraft();
}
function endGame(won) {
  G.state = won ? 'won' : 'lost'; if (document.exitPointerLock) document.exitPointerLock();
  const p = G.human, s = G.stats;
  showOverlay('<h1 style="color:' + (won ? '#8dffb0' : '#ff6a5a') + '">' + (won ? 'ZAFER — Çekirdek korundu!' : 'ÇEKİRDEK DÜŞTÜ') + '</h1>' +
    '<p>Tur ' + G.round + ' / ' + CFG.rounds + ' · Çekirdek ' + Math.ceil(G.coreHp) + ' · Kusursuz tur: ' + s.flawless + ' · Sızıntı: ' + s.leaks + '</p>' +
    '<p>Takım kombosu: ' + s.combos + ' · Aşılama: ' + s.infusions + ' · Senin öldürmen: ' + p.kills + ' · Senin kombon: ' + p.combos + '</p>' +
    '<button class="go" onclick="location.reload()">Yeniden Oyna</button>');
}

function update(dt) {
  if (G.state !== 'prep' && G.state !== 'wave') return;
  G.time += dt; G.stateT += dt;
  if (G.state === 'prep' && G.stateT >= CFG.prepTime) { G.state = 'wave'; G.stateT = 0; }
  if (G.state === 'wave') {
    G.waveT += dt;
    while (G.spawnQ.length && G.spawnQ[G.spawnQ.length - 1].t <= G.waveT) { const s = G.spawnQ.pop(); spawnCreep(s.lane, s.type); }
  }
  for (const a of Input.actions) { if (a === 'map') UI.mapBigUntil = G.time < UI.mapBigUntil ? 0 : G.time + 60; }
  for (const p of G.players) { if (p.isBot) updateBot(p, dt); else updateHuman(p, dt); updateHeroCommon(p, dt); }
  Input.actions.length = 0;
  updateTowers(dt); updateProjectiles(dt); updateCreeps(dt); updateFx(dt);
  if (G.ping && (G.ping.t -= dt) <= 0) { G.ping = null; pingMesh.visible = false; }
  if (coreMesh) { coreMesh.rotation.y += dt * 0.6; coreMesh.rotation.x += dt * 0.25; }
  if (G.coreHp <= 0) return endGame(false);
  if (G.state === 'wave' && !G.spawnQ.length && !G.creeps.length) endRound();
}

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  DesktopSource.poll();
  if (G.state === 'draft') { for (const a of Input.actions) if (a.startsWith('card')) pickCard(+a[4]); Input.actions.length = 0; }
  else if (G.state === 'menu' || G.state === 'won' || G.state === 'lost') Input.actions.length = 0;
  update(dt);
  if (G.human) { updateCamera(); UI.frame(dt); }
  renderer.render(scene, camera);
}
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

function init() {
  const els = shuffle(EL_KEYS.slice());                    // rastgele, tekrarsız element dağıtımı
  for (let i = 0; i < 6; i++) G.players.push(makePlayer(i, els[i]));
  G.human = G.players[0]; Cam.yaw = laneAng(0);
  buildArena(); UI.init(); UI.slots(); DesktopSource.init(); resize();
  const me = ELEMENTS[G.human.el];
  showOverlay('<h1>ALTIGEN REZONANS</h1><p>6 kişilik co-op alan savunması — sen + 5 bot. Yaratıklar altı kenardan Ortak Çekirdek\'e akar.<br>' +
    'Elementin: <b style="color:' + hex(me.color) + '">' + me.icon + ' ' + me.name + '</b>. Kendi kenarında elementin çoğu tur <b>%60 dirençle</b> karşılanır — paylaşmadan kusursuz tur çıkmaz.</p>' +
    '<div class="keys"><div><b>WASD</b> hareket · <b>Fare</b> bakış</div><div><b>Shift</b> sprint (stamina)</div>' +
    '<div><b>Sol tık</b> nişanlı ateş · <b>T</b> oto ateş</div><div><b>R</b> kule koy (limit dolunca en eski taşınır)</div>' +
    '<div><b>E</b> Aşılama: yakındaki dosta 25 sn elementini ver</div><div><b>Q</b> Öz gönder → alanın ult barı dolar</div>' +
    '<div><b>F</b> Ult (Element Novası)</div><div><b>Sağ/Orta tık</b> ping: bir bot yardıma gelir</div>' +
    '<div><b>Tab</b> direnç haritasını büyüt</div><div><b>Rezonans</b>: 2 sn içinde aynı hedefe 2 farklı element</div></div>' +
    '<button class="go" id="goBtn">BAŞLA</button>');
  $('goBtn').onclick = () => { hideOverlay(); lockPointer(); startRound(1); };
  if (AUTO) { hideOverlay(); startRound(1); }
  requestAnimationFrame(loop);
}
init();
/* test/denge kancası: konsoldan __sim(saniye) ile hızlı ileri sar (özellikle ?auto ile) */
window.__G = G; window.__CFG = CFG; window.__sim = sec => { for (let t = 0; t < sec && (G.state === 'prep' || G.state === 'wave'); t += 1 / 30) update(1 / 30); return G.state; };
</script>
