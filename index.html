<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Altıgen Rezonans</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap">
<style>
  /* Minimal tek renk arayüz: siyah zemin, gri kademeler, beyaz vurgu. Paneller tur başında açılır, savaşta kapanır (Tab: sabitle, H: gizle). */
  :root{color-scheme:dark;--w:#f4f5f6;--g1:#b9bcc1;--g2:#7d8187;--line:rgba(255,255,255,.14);--ease:cubic-bezier(.2,.8,.2,1)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#050506;color:var(--w);font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:400;user-select:none;-webkit-user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;inset:0;pointer-events:none;font-size:12px;letter-spacing:.02em}
  #hud>*{transition:opacity .4s,transform .55s var(--ease)}
  body.hud-off #top,body.hud-off #board,body.hud-off #mini,body.hud-off #feed,body.hud-off #bottom,body.hud-off #streak{opacity:0!important}
  .panel{background:rgba(8,8,9,.55);border:1px solid var(--line);backdrop-filter:blur(10px) saturate(0);-webkit-backdrop-filter:blur(10px) saturate(0);padding:12px 16px}
  #fxv{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 16%,transparent 78%,rgba(0,0,0,.72)),radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.5) 100%)}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(255,255,255,.4) 100%);opacity:0;transition:opacity .25s}
  #flash{position:absolute;inset:0;background:#fff;opacity:0}#flash.on{animation:flash .22s ease-out}
  @keyframes flash{from{opacity:.75}to{opacity:0}}
  #top{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:min(420px,60vw);text-align:center;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0}
  #roundTxt{font-size:10px;letter-spacing:.3em;color:var(--g1);text-transform:uppercase}
  #coreBar{position:relative;height:2px;margin:10px 0 0;background:rgba(255,255,255,.16)}
  #coreBar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--w);box-shadow:0 0 8px rgba(255,255,255,.6);transition:width .25s}
  #coreBar span{position:absolute;left:0;right:0;top:9px;font-size:9px;letter-spacing:.24em;color:var(--g2)}
  #chainTxt{margin-top:28px;font-size:10px;letter-spacing:.14em;color:var(--g1);min-height:13px}
  #board{position:absolute;top:20px;left:20px;min-width:236px;transform:translateX(calc(-100% - 30px));opacity:0}
  body.hud-open #board{transform:none;opacity:1}
  #board h4{margin:0 0 10px;font-size:9px;font-weight:400;letter-spacing:.24em;color:var(--g2)}
  #board .row{display:grid;grid-template-columns:18px 48px 30px 1fr 24px;align-items:center;gap:9px;margin:6px 0;font-size:11px;font-variant-numeric:tabular-nums;color:var(--g1)}
  #board .row span:first-child{filter:grayscale(1) brightness(1.3)}
  #board .row.me{color:var(--w);font-weight:600}
  #board .pb{height:1px;background:rgba(255,255,255,.16)}
  #board .pb i{display:block;height:1px;background:var(--w)}
  #board .lk{text-align:right}
  #mini{position:absolute;right:20px;bottom:20px;background:rgba(8,8,9,.55);border:1px solid var(--line);transform:translateX(calc(100% + 30px));opacity:0}
  body.hud-open #mini{transform:none;opacity:1}
  #bottom{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end}
  .slot{background:none;border:0;border-left:1px solid var(--line);backdrop-filter:none;-webkit-backdrop-filter:none;padding:0;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;text-align:left;filter:grayscale(1);transition:max-width .55s var(--ease),opacity .35s,padding .55s var(--ease)}
  body.hud-open .slot{max-width:190px;opacity:1;padding:0 16px}
  .slot b{display:block;font-size:9px;font-weight:400;letter-spacing:.24em;color:var(--g2);margin-bottom:3px}
  .slot span{font-size:12px;font-weight:600}
  .slot small{display:block;color:var(--g2);font-size:10px;margin-top:1px}
  #bars{background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;min-width:250px;padding:0 16px}
  .bar{position:relative;height:2px;background:rgba(255,255,255,.16);margin:16px 0 0}
  .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--w)}
  .bar span{position:absolute;left:0;top:-13px;font-size:8px;letter-spacing:.26em;color:var(--g2)}
  #stam{display:none}
  #ult.full i{box-shadow:0 0 10px #fff;animation:pulse .7s infinite alternate}
  #ult.full span{color:var(--w)}
  @keyframes pulse{from{opacity:.55}to{opacity:1}}
  #info{font-size:10px;color:var(--g2);white-space:nowrap;max-height:0;margin-top:0;opacity:0;overflow:hidden;transition:max-height .45s var(--ease),opacity .3s,margin .45s}
  body.hud-open #info{max-height:20px;margin-top:9px;opacity:1}
  #info b{color:var(--w);font-weight:600}
  #feed{position:absolute;left:20px;bottom:20px;width:330px;font-size:11px;line-height:1.7;color:var(--g1)}
  #feed div{animation:fin .35s var(--ease)}
  #feed *{color:inherit!important;font-weight:400}#feed b{color:var(--w)!important;font-weight:600}
  @keyframes fin{from{opacity:0;transform:translateX(-10px)}}
  #streak{position:absolute;right:13%;top:40%;text-align:right;color:var(--w);opacity:0}
  #streak b{display:block;font-size:68px;font-weight:200;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  #streak span{font-size:9px;letter-spacing:.5em;color:var(--g2)}
  #streak.bump b{animation:bump .2s var(--ease)}
  @keyframes bump{from{transform:scale(1.35);font-weight:600}to{transform:scale(1)}}
  #banner{position:absolute;top:27%;left:0;right:0;text-align:center;font-size:30px;font-weight:200;letter-spacing:.55em;text-indent:.55em;text-transform:uppercase;color:var(--w)!important;text-shadow:0 0 30px rgba(0,0,0,.9);opacity:0}
  #comboBanner{position:absolute;top:63%;left:0;right:0;text-align:center;font-size:13px;font-weight:600;letter-spacing:.42em;text-transform:uppercase;color:var(--w);opacity:0}
  #cross{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--w);box-shadow:0 0 4px #000;transition:width .15s,height .15s,margin .15s}
  #cross.locked{width:36px;height:36px;margin:-18px;background:none;border:1px dashed var(--w);animation:lk 3s linear infinite}
  @keyframes lk{to{transform:rotate(360deg)}}
  #hm{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
  #hm i{position:absolute;width:10px;height:1.5px;background:#fff;box-shadow:0 0 4px #000}
  #hm i:nth-child(1){transform:translate(8px,-12px) rotate(-45deg)}#hm i:nth-child(2){transform:translate(-18px,-12px) rotate(45deg)}
  #hm i:nth-child(3){transform:translate(8px,10px) rotate(45deg)}#hm i:nth-child(4){transform:translate(-18px,10px) rotate(-45deg)}
  #hm.on{animation:hm .16s ease-out}#hm.crit i{height:3px}#hm.kill i{width:16px;height:3px}
  @keyframes hm{from{opacity:1;transform:scale(1.5)}to{opacity:0;transform:scale(.9)}}
  #popups{position:absolute;inset:0;overflow:hidden}
  .pop{position:absolute;left:0;top:0;display:none;will-change:transform,opacity}
  .pop span{display:block;font-weight:400;font-size:12px;color:#fff;text-shadow:0 0 6px #000,0 1px 2px #000;white-space:nowrap;font-variant-numeric:tabular-nums;animation:popin .14s ease-out}
  .pop.crit span{font-size:24px;font-weight:600}
  .pop.combo span{font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;border-bottom:1px solid #fff;padding-bottom:2px}
  @keyframes popin{from{transform:scale(1.9)}to{transform:scale(1)}}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,4,5,.84);backdrop-filter:blur(16px) grayscale(1);-webkit-backdrop-filter:blur(16px) grayscale(1);pointer-events:auto;transition:opacity .45s,visibility .45s}
  #overlay.hide{opacity:0;visibility:hidden;pointer-events:none}
  .box{max-width:1000px;width:92%;text-align:center;max-height:100%;overflow-y:auto;padding:18px 0;animation:rise .6s var(--ease)}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}}
  .box h1{margin:0 0 16px;font-size:28px;font-weight:200;letter-spacing:.5em;text-indent:.5em;text-transform:uppercase;color:var(--w)!important}
  .box p{color:var(--g1);line-height:1.75;margin:6px auto;font-size:13px;max-width:640px}
  .box p b,.box p [style]{color:var(--w)!important;font-weight:600}
  .keys{display:grid;grid-template-columns:repeat(2,1fr);gap:0 28px;text-align:left;margin:26px auto 8px;max-width:680px;font-size:12px;color:var(--g1)}
  .keys div{padding:9px 0;border-top:1px solid var(--line)}
  .keys b{color:var(--w);font-weight:600}
  button.go{pointer-events:auto;margin-top:26px;padding:15px 52px;font:inherit;font-size:11px;font-weight:600;letter-spacing:.5em;text-indent:.5em;background:transparent;border:1px solid var(--w);color:var(--w);cursor:pointer;transition:background .25s,color .25s,letter-spacing .35s var(--ease)}
  button.go:hover{background:var(--w);color:#0a0a0b;letter-spacing:.62em}
  .chips{display:flex;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .chip{font-size:9px;letter-spacing:.2em;padding:0 16px;border-left:1px solid var(--line);color:var(--g2);text-transform:uppercase;filter:grayscale(1)}
  .chip:first-child{border-left:0}.chip b{display:block;margin-top:4px;font-size:12px;letter-spacing:.02em;text-transform:none;color:var(--w);font-weight:600}
  .cards{display:flex;gap:1px;justify-content:center;flex-wrap:wrap;margin:28px auto 0;width:fit-content;max-width:100%;background:var(--line);border:1px solid var(--line)}
  .card{position:relative;display:flex;flex-direction:column;width:218px;padding:16px 18px 18px;background:#0b0b0c;color:var(--w);cursor:pointer;text-align:left;transition:background .28s,color .28s;animation:cardin .6s backwards var(--ease)}
  .card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}.card:nth-child(4){animation-delay:.24s}
  @keyframes cardin{from{opacity:0;transform:translateY(22px)}}
  .card .hd{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.24em;color:var(--g2)}
  .card .ic{font-size:30px;line-height:1;margin:30px 0 16px;filter:grayscale(1) contrast(1.15) brightness(1.25);transition:transform .35s var(--ease)}
  .card .n{font-size:17px;font-weight:600}
  .card .pips{font-size:9px;letter-spacing:.2em;color:var(--g2);margin:7px 0 14px;white-space:pre}.card .pips i{font-style:normal;color:var(--w)}
  .card .d{font-size:12px;color:var(--g1);line-height:1.55;min-height:56px;flex:1;padding-bottom:12px}
  .card .st{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  .card .st span{color:var(--g2)}.card .st b{font-weight:400;color:var(--g1);white-space:nowrap}.card .st b i{font-style:normal;font-weight:600;color:var(--w)}
  .card .a{margin-top:14px;font-size:9px;font-weight:600;letter-spacing:.24em;color:var(--g1)}
  .card:hover{background:var(--w);color:#0a0a0b}
  .card:hover .ic{filter:grayscale(1) invert(1) contrast(1.2);transform:translateY(-6px)}
  .card:hover .hd,.card:hover .pips,.card:hover .d,.card:hover .st span,.card:hover .st b,.card:hover .a{color:#4a4d52}
  .card:hover .st{border-color:rgba(0,0,0,.14)}.card:hover .st b i,.card:hover .pips i{color:#0a0a0b}
  button.re{pointer-events:auto;margin-top:22px;padding:6px 2px;background:none;border:0;border-bottom:1px solid var(--g2);color:var(--g1);font:inherit;font-size:10px;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;transition:color .2s,border-color .2s}
  button.re:hover:not(:disabled){color:var(--w);border-color:var(--w)}button.re:disabled{opacity:.3;cursor:default}
  table.end{margin:22px auto 0;border-collapse:collapse;font-variant-numeric:tabular-nums;filter:grayscale(1)}
  table.end th{font-size:9px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--g2);padding:6px 16px}
  table.end td{padding:8px 16px;font-size:12px;color:var(--g1);border-top:1px solid var(--line)}table.end tr.me td{color:var(--w);font-weight:600}
  @media (max-width:900px){#feed{display:none}.keys{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="fxv"></div>
  <div id="vig"></div>
  <div id="flash"></div>
  <div id="top" class="panel"><div id="roundTxt">—</div><div id="coreBar"><i></i><span></span></div><div id="chainTxt"></div></div>
  <div id="board" class="panel"></div>
  <canvas id="mini" width="170" height="170"></canvas>
  <div id="feed"></div>
  <div id="streak"><b>x0</b><span>SERİ</span></div>
  <div id="bottom">
    <div class="panel slot" id="sCore"><b>SİLAH</b><span></span><small></small></div>
    <div class="panel slot" id="sMod"><b>MOD</b><span></span><small></small></div>
    <div class="panel slot" id="sPas"><b>PASİF</b><span></span><small></small></div>
    <div class="panel slot" id="sEcho"><b>REZONANS</b><span></span><small></small></div>
    <div class="panel" id="bars">
      <div class="bar" id="stam"><i></i><span>STAMINA</span></div>
      <div class="bar" id="ult"><i></i><span>ULT [F]</span></div>
      <div id="info"></div>
    </div>
  </div>
  <div id="banner"></div>
  <div id="comboBanner"></div>
  <div id="cross"></div>
  <div id="hm"><i></i><i></i><i></i><i></i></div>
  <div id="popups"></div>
  <div id="overlay"><div class="box" id="ovBox"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
'use strict';
/* ============================================================================
   ALTIGEN REZONANS — tek dosyalık alan savunması prototipi (1 oyuncu + 5 bot)
   Herkesin kendi adası ve kendi çekirdeği var: kimse alanından çıkmaz, herkes kendini savunur.
   Bölümler: 1 Config/Data · 2 Wave Generator · 3 Graphics+Entities (pool) · 4 Feel+SFX
             5 Combat+Combo · 6 Bot AI · 7 Camera/Input · 8 UI/HUD · 9 Game loop
   ========================================================================== */

/* ============================ 1. CONFIG / DATA ============================ */
const CFG = {
  arena:   { coreAl: 40, spawnAl: 110, postAl: 56, laneHalfW: 8.5, coreR: 3.2 },   // şerit-yerel: al = merkezden uzaklık, la = yanal
  zone:    { aMin: 47, aMax: 76, lat: 7 },                 // oyuncunun sabit hareket alanı
  core:    { hp: 30 },                                       // herkesin KENDİ çekirdeği
  rounds:  20, bossRounds: [5, 10, 15, 20], prepTime: 3,
  player:  { walk: 8, sprint: 13, stamina: 100, staminaDrain: 22, staminaRegen: 16 },
  crit:    { chance: 0.12, mult: 2.0 },
  target:  { danger: 12 },
  cam:     { back: 6.5, la: 5.6, y: 6.2, ahead: 13, lookLa: -3, lookY: 1.2 },   // sabit köşe kamerası: karakterin arka-üst köşesinden (koridor-yerel)                                  // bu mesafeden yakına giren yaratık her zaman ilk hedef
  combo:   { window: 2.0, icd: 0.9, splash: 0.7, echoLvl: 0.25 },
  ult:     { need: 100, perKill: 3, streakBonus: 0.03, streakCap: 20, radius: 17, dmg: 170, kb: 7 },
  wave:    { baseCount: 8, countPer: 2, baseHp: 32, hpGrowth: 1.13, spawnWindow: 13, speed: 5.4 },
  flawless:{ dmgPerChain: 0.08, maxChain: 5, extraCards: 1 },
  bot:     { dmgBonus: 1.35, wander: 5 },

  stance:  { every: 5 },                                    // serinin her 5 katında bir sonraki şov duruşu (POSES)
  feel:    { streakWindow: 2.6, shakeMax: 0.9, shakeDecay: 2.2, hitstopScale: 0.05, kickDecay: 9,
             streakShake: { from: 5, cap: 30, floor: 0.24, bonus: 1.1 },   // seri büyüdükçe sürekli titreşim (tavanlı)
             trauma: { shot: 0.035, crit: 0.14, kill: 0.1, combo: 0.26, ult: 0.9, leak: 0.7, boss: 1 } },
  pools:   { creeps: 320, proj: 380, fx: 110, rings: 48, beams: 72, debris: 460, splats: 70, popups: 44 },
};

/* Element = kimlik + doğuştan vuruş özelliği (trait). */
const ELEMENTS = {
  FIRE:      { name: 'Ateş',     color: 0x0d0d0d, icon: '🔥', tone: 196, trait: { dot: 0.4, dotDur: 2.5 },            tdesc: 'Yakar: 2,5 sn ek hasar' },
  WATER:     { name: 'Su',       color: 0x0d0d0d, icon: '💧', tone: 262, trait: { slow: 0.28, slowDur: 1.3 },         tdesc: 'Yavaşlatır' },
  EARTH:     { name: 'Toprak',   color: 0x0d0d0d, icon: '⛰️', tone: 147, trait: { kb: 0.35, stunCh: 0.1, stun: 0.6 }, tdesc: 'İter, %10 sersemletir' },
  AIR:       { name: 'Hava',     color: 0x0d0d0d, icon: '🌪️', tone: 330, trait: { kb: 0.6 },                          tdesc: 'Güçlü geri itme' },
  LIGHTNING: { name: 'Yıldırım', color: 0x0d0d0d, icon: '⚡', tone: 392, trait: { arcCh: 0.22, arc: 0.6 },            tdesc: '%22 yakındakine sıçrar' },
  POISON:    { name: 'Zehir',    color: 0x0d0d0d, icon: '☠️', tone: 220, trait: { vuln: 2.5 },                        tdesc: 'Hedefi zayıflatır (+%30 hasar alır)' },
};
const EL_KEYS = Object.keys(ELEMENTS);

/* Rezonans komboları: oyuncu draft'tan 2. element (Rezonans slotu) alırsa atışları dönüşümlü gider ve
   2 sn içinde aynı hedefe iki farklı element değince tetiklenir. */
const COMBOS = {
  'FIRE+WATER':       { name: 'Buhar Patlaması', mult: 2.4, aoe: 7 },
  'WATER+LIGHTNING':  { name: 'İletim',          mult: 2.0, chain: 4 },
  'EARTH+AIR':        { name: 'Kum Fırtınası',   mult: 1.6, aoe: 8, slow: 0.55, slowDur: 3.5 },
  'FIRE+POISON':      { name: 'Toksik Alev',     mult: 1.8, dot: 0.9, dotDur: 4 },
  'FIRE+EARTH':       { name: 'Magma',           mult: 2.2, aoe: 5, slow: 0.3, slowDur: 2 },
  'FIRE+AIR':         { name: 'Alev Girdabı',    mult: 2.0, aoe: 9 },
  'FIRE+LIGHTNING':   { name: 'Plazma',          mult: 3.4 },
  'WATER+EARTH':      { name: 'Bataklık',        mult: 1.5, aoe: 6, slow: 0.7, slowDur: 3 },
  'WATER+AIR':        { name: 'Buz Fırtınası',   mult: 1.7, aoe: 5, stun: 1.3 },
  'WATER+POISON':     { name: 'Asit Yağmuru',    mult: 1.6, aoe: 6, vuln: 5 },
  'EARTH+LIGHTNING':  { name: 'Manyetik Şok',    mult: 2.0, stun: 1.6 },
  'EARTH+POISON':     { name: 'Çürüme',          mult: 1.6, dot: 0.6, dotDur: 4, vuln: 4 },
  'AIR+LIGHTNING':    { name: 'Fırtına',         mult: 1.8, chain: 5 },
  'AIR+POISON':       { name: 'Zehir Bulutu',    mult: 1.5, aoe: 8, dot: 0.5, dotDur: 4 },
  'LIGHTNING+POISON': { name: 'Nörotoksin',      mult: 1.9, stun: 1.0, dot: 0.6, dotDur: 3 },
};
const comboKey = (a, b) => EL_KEYS.indexOf(a) < EL_KEYS.indexOf(b) ? a + '+' + b : b + '+' + a;

/* Silah çekirdekleri. kind: proj | beam | chain · kb: vuruş başı geri itme · kbMul: element itmesinin çarpanı */
const CORES = {

function genWave(round) {
  const W = CFG.wave, q = [], n = Math.round(W.baseCount + W.countPer * round), boss = CFG.bossRounds.includes(round);
  for (let e = 0; e < 6; e++) {
    for (let i = 0; i < n; i++) {
      const r = Math.random();
      let type = 'grunt';
      if (round >= 3 && r < 0.12 + round * 0.012) type = 'tank';
      else if (round >= 2 && r < 0.4) type = 'runner';
      q.push({ t: 1 + (i / n) * W.spawnWindow * (1 + round * 0.03) + Math.random() * 1.5, lane: e, type });
    }
    if (boss) q.push({ t: 9 + e * 0.4, lane: e, type: 'boss' });     // boss turunda her alana bir boss
  }
  q.sort((a, b) => b.t - a.t);
  return q;
}

  while (f.children.length > 5) f.removeChild(f.firstChild);
  setTimeout(() => { if (d.parentNode) d.parentNode.removeChild(d); }, 7000);
}
function banner(text, color) { const b = $('banner'); b.textContent = text; b.style.color = color || '#fff'; b.style.opacity = 1; UI.bannerT = 2.4; }
function comboBanner(text) { const b = $('comboBanner'); b.textContent = '⟡ ' + text; b.style.opacity = 1; UI.comboT = 0.9; }
function vignette(v) { $('vig').style.opacity = v; UI.vigT = 0.35; }

/* --------------------------------- draft ---------------------------------- */
const SLOT_T = { core: ['SİLAH ÇEKİRDEĞİ', CORES], mod: ['MOD', MODS], passive: ['PASİF', PASSIVES], echo: ['REZONANS ELEMENTİ', ELEMENTS] };
function genCards(p, n) {
  const b = p.build, pool = [], out = [{ slot: 'core', id: b.core }];     // en az bir yükseltme garantili
  for (const s in SLOT_T) for (const id in SLOT_T[s][1]) if (!(s === 'echo' && id === p.el)) pool.push({ slot: s, id });
  shuffle(pool);
  for (const c of pool) { if (out.length >= n) break; if (out.some(o => o.slot === c.slot && o.id === c.id) || (c.slot === 'echo' && out.some(o => o.slot === 'echo'))) continue; out.push(c); }
  return shuffle(out);
}
function applyCard(p, c) { const b = p.build; if (b[c.slot] === c.id) b[c.slot + 'Lvl']++; else b[c.slot] = c.id; calcStats(p); }
function cardText(p, c) {
  if (c.slot !== 'echo') { const d = SLOT_T[c.slot][1][c.id]; return [d.name, d.desc]; }
  const e = ELEMENTS[c.id], cb = COMBOS[comboKey(p.el, c.id)];
  return [e.icon + ' ' + e.name, 'Atışların ' + ELEMENTS[p.el].name + ' / ' + e.name + ' dönüşümlü gider → <b>' + cb.name + '</b> kombosu (x' + cb.mult + '). ' + e.tdesc + '.'];
}
const SLOT_C = { core: '#fff', mod: '#fff', passive: '#fff', echo: '#fff' };
const ICONS = { single: '◎', arc: '💥', beam: '🔦', chain: '⚡', scatter: '✸', pierce: '➹', ricochet: '↯', multi: '⫶', dot: '🔥', slow: '❄️', homing: '🎯',
  power: '💪', haste: '⏩', reach: '📡', sharp: '👁️', brutal: '🗡️', charger: '🔋', mender: '🛠️', resonator: '🔊', impact: '🔨' };
const PASS_LBL = { dmg: ['Hasar', 1], rate: ['Atış hızı', 1], range: ['Menzil', 1], crit: ['Kritik şansı', 1], critMult: ['Kritik hasarı', 1], ult: ['Ult dolumu', 1], combo: ['Kombo hasarı', 1], kb: ['Geri itme', 1], mend: ['Tur sonu onarım', 0] };
const f1 = v => String(Math.round(v * 10) / 10);
function modText(id, lvl) {
  const m = MODS[id], ml = 1 + LVL.mod * (lvl - 1);
  if (m.pierce) return 'Delme ' + Math.round(m.pierce * ml); if (m.bounce) return 'Sekme ' + Math.round(m.bounce * ml); if (m.extra) return '+' + (m.extra + lvl - 1) + ' mermi';
  if (m.dotPct) return '%' + Math.round(m.dotPct * ml * 100) + '/sn yanık'; if (m.slow) return '%' + Math.round(Math.min(0.7, m.slow * (1 + LVL.modSlow * (lvl - 1))) * 100) + ' yavaş';
  return 'Dönüş ' + f1(m.turn * ml);
}
/* Kartın sayısal etkisi: [etiket, şimdiki (yoksa null), seçince]. */
function cardStats(p, c) {
  const b = p.build, lv = b[c.slot + 'Lvl'], up = b[c.slot] === c.id, nl = up ? lv + 1 : lv, R = [];
  if (c.slot === 'core') {
    const d = CORES[c.id], cur = CORES[b.core], k = l => 1 + LVL.coreDmg * (l - 1), dps = (x, l) => x.dmg * (x.pellets || 1) * x.rate * k(l);
    if (up) R.push(['Vuruş hasarı', f1(d.dmg * k(lv)), f1(d.dmg * k(nl))]); else { R.push(['Menzil', cur.range, d.range]); R.push(['Atış / sn', cur.rate, d.rate]); }
    R.push(['Tek hedef DPS', Math.round(dps(cur, lv)), Math.round(dps(d, nl))]);
  } else if (c.slot === 'mod') R.push(['Etki', up ? modText(c.id, lv) : null, modText(c.id, nl)]);
  else if (c.slot === 'passive') { const d = PASSIVES[c.id]; for (const k in PASS_LBL) if (d[k]) { const v = l => '+' + (PASS_LBL[k][1] ? '%' + Math.round(d[k] * l * 100) : d[k] * l + ' can'); R.push([PASS_LBL[k][0], up ? v(lv) : null, v(nl)]); } }
  else {
    const cb = COMBOS[comboKey(p.el, c.id)], m = l => 'x' + f1(cb.mult * (1 + CFG.combo.echoLvl * (l - 1))); R.push(['Kombo çarpanı', up ? m(lv) : null, m(nl)]);
    if (cb.aoe) R.push(['Alan', null, cb.aoe + ' br']); if (cb.chain) R.push(['Sıçrama', null, cb.chain + ' hedef']); if (cb.stun) R.push(['Sersemletme', null, cb.stun + ' sn']);
    if (cb.slow) R.push(['Yavaşlatma', null, '%' + Math.round(cb.slow * 100)]); if (cb.dot) R.push(['Yanık', null, cb.dotDur + ' sn']); if (cb.vuln) R.push(['Zayıflatma', null, cb.vuln + ' sn']);
  }
  return R;
}
let draftCards = null;
function openDraft() {
  G.state = 'draft'; if (document.exitPointerLock) document.exitPointerLock();
  for (const p of G.players) if (p.isBot && p.alive) botDraft(p);
  if (AUTO) { closeDraft(); return; }
  G.rerolls = 1; draftCards = genCards(G.human, 3 + (G.extraCard ? CFG.flawless.extraCards : 0)); renderDraft();
}
function renderDraft() {
  const hp = G.human, b = hp.build, n = draftCards.length, mine = G.roundLeaks[0], chip = (t, v) => '<span class="chip">' + t + ' <b>' + v + '</b></span>';
  let h = '<h1>TUR ' + G.round + ' TAMAMLANDI</h1><p>' + (mine === 0 ? '<b>KUSURSUZ TUR.</b> Ekstra kart kazandın.' : 'Çekirdeğine ' + mine + ' yaratık ulaştı.') +
    (hp.chain > 0 ? ' Kusursuz zincir x' + hp.chain + ' (hasar +%' + Math.round(hp.chain * CFG.flawless.dmgPerChain * 100) + ').' : '') + '</p><div class="chips">' +
    chip('SİLAH', CORES[b.core].name + ' Lv' + b.coreLvl) + chip('MOD', b.mod ? MODS[b.mod].name + ' Lv' + b.modLvl : '—') + chip('PASİF', b.passive ? PASSIVES[b.passive].name + ' Lv' + b.passiveLvl : '—') +
    chip('REZONANS', b.echo ? ELEMENTS[b.echo].icon + ' ' + COMBOS[comboKey(hp.el, b.echo)].name + ' Lv' + b.echoLvl : '—') + '</div><div class="cards">';
  draftCards.forEach((c, i) => {
    const tx = cardText(hp, c), cur = b[c.slot], up = cur === c.id, lv = b[c.slot + 'Lvl'], nl = up ? lv + 1 : lv;
    h += '<div class="card" style="--c:' + SLOT_C[c.slot] + '" data-i="' + i + '"><div class="hd"><span>' + SLOT_T[c.slot][0] + '</span><span class="key">' + (i + 1) + '</span></div>' +
      '<div class="ic">' + (c.slot === 'echo' ? ELEMENTS[c.id].icon : ICONS[c.id] || '◆') + '</div><div class="n">' + (c.slot === 'echo' ? ELEMENTS[c.id].name : tx[0]) + '</div>' +
      '<div class="pips">' + '●'.repeat(Math.min(up ? lv : nl, 10)) + (up ? '<i>◆</i>' : '') + '  Lv ' + nl + '</div><div class="d">' + tx[1] + '</div>';
    for (const r of cardStats(hp, c)) h += '<div class="st"><span>' + r[0] + '</span><b>' + (r[1] != null && String(r[1]) !== String(r[2]) ? r[1] + ' → <i>' + r[2] + '</i>' : '<i>' + r[2] + '</i>') + '</b></div>';
    h += '<div class="a">' + (up ? '▲ YÜKSELT' : cur ? '⇄ DEĞİŞTİR · ' + (c.slot === 'echo' ? ELEMENTS[cur].name : SLOT_T[c.slot][1][cur].name) + ' yerine' : '✚ YENİ') + '</div></div>';
  });
  showOverlay(h + '</div><button class="re" id="reBtn"' + (G.rerolls > 0 ? '' : ' disabled') + '>↻ Kartları yenile (' + G.rerolls + ' hak)</button><p style="font-size:12px;opacity:.7">Tıkla ya da 1–' + n + ' tuşlarıyla seç</p>');
  document.querySelectorAll('.card').forEach(el => el.onclick = () => pickCard(+el.dataset.i));
  $('reBtn').onclick = () => { if (G.rerolls <= 0) return; G.rerolls--; draftCards = genCards(hp, n); SFX.pick(); renderDraft(); };
}
function pickCard(i) { if (G.state !== 'draft' || !draftCards || !draftCards[i]) return; applyCard(G.human, draftCards[i]); draftCards = null; SFX.pick(); closeDraft(); }
function closeDraft() { hideOverlay(); UI.slots(); startRound(G.round + 1); }
function showOverlay(html) { $('ovBox').innerHTML = html; $('overlay').classList.remove('hide'); }
function hideOverlay() { $('overlay').classList.add('hide'); }

/* =============================== 9. GAME LOOP ============================== */
function startRound(n) {
  G.round = n; G.state = 'prep'; G.stateT = 0; G.roundLeaks.fill(0); G.waveT = 0;
  G.roundHp = CFG.wave.baseHp * Math.pow(CFG.wave.hpGrowth, n - 1);
  G.spawnQ = genWave(n).filter(s => G.players[s.lane].alive); G.hudAuto = G.time + CFG.prepTime + 1.5;
  const boss = CFG.bossRounds.includes(n);
  banner('TUR ' + n + (boss ? ' — BOSS' : ''), boss ? '#ff6a5a' : '#fff'); SFX.round(); if (boss) SFX.boss();
}
function endRound() {
  const F = CFG.flawless;
  for (const p of G.players) {
    if (!p.alive) continue;
    p.chain = G.roundLeaks[p.id] === 0 ? Math.min(F.maxChain, p.chain + 1) : 0;         // kusursuz zincir kişiseldir
    if (p.stats.mend) p.core = Math.min(CFG.core.hp, p.core + p.stats.mend);
  }
  G.extraCard = G.roundLeaks[0] === 0; if (G.extraCard) G.stats.flawless++;
  if (G.round >= CFG.rounds) return endGame(true);
  openDraft();
}
function endGame(won) {
  G.state = won ? 'won' : 'lost'; if (document.exitPointerLock) document.exitPointerLock();
  const rows = G.players.slice().sort((a, b) => (b.alive - a.alive) || (b.outRound - a.outRound) || (b.kills - a.kills));
  let t = '<table class="end"><tr><th></th><th>Oyuncu</th><th>Öldürme</th><th>Hasar</th><th>Kombo</th><th>Çekirdek</th></tr>';
  rows.forEach((o, i) => t += '<tr class="' + (o === G.human ? 'me' : '') + '"><td>' + (i === 0 ? '👑' : '') + '</td><td>' + ELEMENTS[o.el].icon + ' ' + o.name + '</td><td>' + o.kills + '</td><td>' + Math.round(o.dmgDone) + '</td><td>' + o.combos + '</td><td>' + (o.alive ? Math.ceil(o.core) + ' can' : 'elendi (tur ' + o.outRound + ')') + '</td></tr>');
  showOverlay('<h1 style="color:' + (won ? '#8dffb0' : '#ff6a5a') + '">' + (won ? 'ZAFER — Çekirdeğin ayakta!' : 'ÇEKİRDEĞİN DÜŞTÜ') + '</h1>' +
    '<p>Tur ' + G.round + ' / ' + CFG.rounds + ' · Kusursuz tur: ' + G.stats.flawless + ' · En iyi serin: x' + FEEL.best + '</p>' + t + '</table>' +
    '<button class="go" onclick="location.reload()">Yeniden Oyna</button>');
}
function update(dt) {
  if (G.state !== 'prep' && G.state !== 'wave') return;
  G.time += dt; G.stateT += dt;
  if (G.state === 'prep' && G.stateT >= CFG.prepTime) { G.state = 'wave'; G.stateT = 0; }
  if (G.state === 'wave') { G.waveT += dt; while (G.spawnQ.length && G.spawnQ[G.spawnQ.length - 1].t <= G.waveT) { const s = G.spawnQ.pop(); spawnCreep(s.lane, s.type); } }
  for (const p of G.players) { if (!p.alive) continue; FXOFF = p.id !== 0; if (p.isBot) updateBot(p, dt); else updateHuman(p, dt); updateHeroCommon(p, dt); }
  Input.actions.length = 0;
  updateProjectiles(dt); updateCreeps(dt); FXOFF = false; renderVoxels(); updatePixels(dt); updateFx(dt); updateScenery(dt);
  if (!G.human.alive) return endGame(false);
  if (G.state === 'wave' && !G.spawnQ.length && !G.creeps.length) endRound();
}
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  DesktopSource.poll();
  if (G.state === 'draft') { for (const a of Input.actions) if (a.startsWith('card')) pickCard(+a[4]); Input.actions.length = 0; }
  else if (G.state === 'menu' || G.state === 'won' || G.state === 'lost') Input.actions.length = 0;
  let sdt = dt; if (FEEL.hitstop > 0) { FEEL.hitstop -= dt; sdt = dt * CFG.feel.hitstopScale; }      // hitstop: kısa zaman donması
  for (let i = 0; i < G.speed; i++) update(sdt);            // hızlandırma: aynı karede birden çok sim adımı
  FEEL.update(dt);
  if (G.human) { updateCamera(dt); UI.frame(dt); }
  if (composer && G.bloom) composer.render(); else renderer.render(scene, camera);
}
function resize() {
  renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth, innerHeight); }
}
addEventListener('resize', resize);

function init() {
  const els = shuffle(EL_KEYS.slice());                    // rastgele, tekrarsız element dağıtımı
  for (let i = 0; i < 6; i++) G.players.push(makePlayer(i, els[i]));
  G.human = G.players[0]; Cam.yaw = laneAng(0);
  buildArena(); initPost(); UI.init(); UI.slots(); DesktopSource.init(); resize();
  const me = ELEMENTS[G.human.el];
  showOverlay('<h1>ALTIGEN REZONANS</h1><p>İstasyonun gövdesi yarıldı; koridorun ucunda bir kara delik açık. Sen bu beton koridorun bekçisisin ve bu ucundaki <b>geçidi koruyorsun</b>: mühür kristaline ulaşan her yaratık canını azaltır, mührü düşen elenir. 20 tur dayan.<br>' +
    'Elementin: <b style="color:' + hex(me.color) + '">' + me.icon + ' ' + me.name + '</b> — ' + me.tdesc + '. Kamera sabit; savaşı izle, build\'i sen yönet.</p>' +
    '<div class="keys"><div><b>Otomatik</b>: karakter ortada durur, hedefini seçer, ateş eder ve ultisini kendi kullanır</div><div><b>Sen</b>: tur aralarında kart seçerek build\'i kurarsın (tıkla ya da 1–4)</div>' +
    '<div><b>G</b> oyun hızı x1 / x2 / x3</div><div><b>Tab</b> panelleri aç / kapat · <b>H</b> arayüzü gizle</div>' +
    '<div><b>[ ]</b> görüş açısı</div><div><b>M</b> ses · <b>B</b> ışıma</div></div>' +
    '<button class="go" id="goBtn">BAŞLA</button>');
  $('goBtn').onclick = () => { SFX.init(); hideOverlay(); startRound(1); };
  if (AUTO) { hideOverlay(); startRound(1); }
  requestAnimationFrame(loop);
}
init();
/* test/denge kancası: ?auto ile aç, konsoldan __sim(saniye) ile hızlı ileri sar */
window.__G = G; window.__CFG = CFG; window.__sim = sec => { for (let t = 0; t < sec && (G.state === 'prep' || G.state === 'wave'); t += 1 / 30) update(1 / 30); return G.state; };
</script>
