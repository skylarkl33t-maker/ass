<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Altıgen Rezonans</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#07080f;color:#e8eef7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;inset:0;pointer-events:none;font-size:13px}
  .panel{background:rgba(9,12,22,.7);border:1px solid rgba(140,170,255,.16);border-radius:8px;padding:8px 10px;backdrop-filter:blur(3px)}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(255,30,40,.55) 100%);opacity:0;transition:opacity .25s}
  #top{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;min-width:340px}
  #roundTxt{font-weight:700;font-size:15px;letter-spacing:.5px}
  #coreBar{position:relative;height:18px;margin:6px 0 4px;background:#161c2b;border-radius:9px;overflow:hidden}
  #coreBar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#39d0ff,#7af7d0);transition:width .2s}
  #coreBar span{position:relative;font-size:12px;font-weight:700;line-height:18px;color:#04121c}
  #chainTxt{font-size:12px;color:#ffd76a;min-height:15px}
  #board{position:absolute;top:10px;left:10px;min-width:250px}
  #board h4{margin:0 0 5px;font-size:11px;letter-spacing:.8px;color:#8fa0ba}
  #board .row{display:grid;grid-template-columns:22px 52px 44px 1fr 34px;align-items:center;gap:5px;margin:3px 0;font-size:12px;font-variant-numeric:tabular-nums}
  #board .row.me{color:#ffd76a;font-weight:700}
  #board .pb{height:7px;background:#161c2b;border-radius:4px;overflow:hidden}
  #board .pb i{display:block;height:100%;background:#39d0ff}
  #board .lk{text-align:right}
  #mini{position:absolute;right:10px;bottom:10px;border-radius:8px;background:rgba(9,12,22,.7);border:1px solid rgba(140,170,255,.16)}
  #bottom{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:stretch}
  .slot{min-width:108px;text-align:center}
  .slot b{display:block;font-size:10px;color:#8fa0ba;letter-spacing:.6px}
  .slot span{font-size:13px;font-weight:700}
  .slot small{display:block;color:#ffd76a;font-size:10px}
  #bars{min-width:220px}
  .bar{position:relative;height:12px;background:#161c2b;border-radius:6px;overflow:hidden;margin:3px 0}
  .bar i{position:absolute;left:0;top:0;bottom:0;width:0}
  .bar span{position:relative;display:block;font-size:10px;line-height:12px;text-align:center;font-weight:700;text-shadow:0 0 3px #000}
  #stam i{background:#7bd88f}
  #ult i{background:linear-gradient(90deg,#8a5bff,#ff7bd5)}
  #ult.full{box-shadow:0 0 12px #ff7bd5;animation:pulse .7s infinite alternate}
  @keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.6)}}
  #info{font-size:11px;color:#b9c6da;margin-top:3px;white-space:nowrap}
  #info b{color:#fff}
  #feed{position:absolute;left:10px;bottom:10px;width:330px;font-size:12px;line-height:1.5}
  #feed div{background:rgba(9,12,22,.6);padding:1px 6px;border-radius:4px;margin-top:2px;width:fit-content}
  #streak{position:absolute;right:16%;top:38%;text-align:center;font-weight:900;font-style:italic;color:#ffd76a;text-shadow:0 0 12px #f60,0 2px 0 #000;opacity:0;transition:opacity .3s}
  #streak b{display:block;font-size:54px;line-height:1}
  #streak span{font-size:13px;letter-spacing:3px}
  #streak.bump b{animation:bump .18s}
  @keyframes bump{from{transform:scale(1.7) rotate(-6deg)}to{transform:scale(1)}}
  #banner{position:absolute;top:24%;left:0;right:0;text-align:center;font-size:42px;font-weight:900;letter-spacing:3px;text-shadow:0 0 18px #000;opacity:0;transition:opacity .3s}
  #comboBanner{position:absolute;top:62%;left:0;right:0;text-align:center;font-size:26px;font-weight:900;font-style:italic;color:#ffd76a;text-shadow:0 0 12px #f60;opacity:0;transition:opacity .2s}
  #cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 3px #000}
  #hm{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
  #hm i{position:absolute;width:11px;height:2.5px;background:#fff;border-radius:2px;box-shadow:0 0 4px #000}
  #hm i:nth-child(1){transform:translate(7px,-12px) rotate(-45deg)}#hm i:nth-child(2){transform:translate(-18px,-12px) rotate(45deg)}
  #hm i:nth-child(3){transform:translate(7px,10px) rotate(45deg)}#hm i:nth-child(4){transform:translate(-18px,10px) rotate(-45deg)}
  #hm.on{animation:hm .16s ease-out}#hm.crit i{background:#ffd23a}#hm.kill i{background:#ff4a4a;width:14px}
  @keyframes hm{from{opacity:1;transform:scale(1.5)}to{opacity:0;transform:scale(.9)}}
  #popups{position:absolute;inset:0;overflow:hidden}
  .pop{position:absolute;left:0;top:0;display:none;will-change:transform,opacity}
  .pop span{display:block;font-weight:900;font-size:14px;text-shadow:0 0 3px #000,0 1px 2px #000;white-space:nowrap;animation:popin .14s ease-out}
  .pop.crit span{color:#ffd23a;font-size:22px;font-style:italic}.pop.combo span{color:#ff9d3a;font-size:19px;font-style:italic}
  @keyframes popin{from{transform:scale(2.1)}to{transform:scale(1)}}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,5,10,.84);pointer-events:auto}
  #overlay.hide{display:none}
  .box{max-width:900px;width:92%;text-align:center}
  .box h1{margin:0 0 6px;font-size:36px;letter-spacing:2px}
  .box p{color:#b9c6da;line-height:1.55;margin:6px 0}
  .keys{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 18px;text-align:left;margin:14px auto;max-width:600px;font-size:13px}
  .keys b{color:#ffd76a}
  button.go{pointer-events:auto;margin-top:12px;padding:12px 34px;font-size:17px;font-weight:800;border:0;border-radius:8px;background:#39d0ff;color:#04121c;cursor:pointer}
  .cards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .card{width:190px;padding:14px 12px;border-radius:10px;background:#121829;border:2px solid #2b3850;cursor:pointer;text-align:center;transition:transform .12s,border-color .12s,box-shadow .12s}
  .card:hover{transform:translateY(-6px) scale(1.03);border-color:#39d0ff;box-shadow:0 0 22px rgba(57,208,255,.35)}
  .card .t{font-size:10px;letter-spacing:1px;color:#8fa0ba}
  .card .n{font-size:17px;font-weight:800;margin:6px 0}
  .card .d{font-size:12px;color:#b9c6da;min-height:48px}
  .card .a{margin-top:8px;font-size:11px;font-weight:800;color:#ffd76a}
  table.end{margin:12px auto;border-collapse:collapse;font-variant-numeric:tabular-nums}
  table.end td,table.end th{padding:4px 14px;font-size:13px}table.end tr.me td{color:#ffd76a;font-weight:700}
  @media (max-width:900px){#board{transform:scale(.8);transform-origin:top left}#feed{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="vig"></div>
  <div id="top" class="panel"><div id="roundTxt">—</div><div id="coreBar"><i></i><span></span></div><div id="chainTxt"></div></div>
  <div id="board" class="panel"></div>
  <canvas id="mini" width="170" height="170"></canvas>
  <div id="feed"></div>
  <div id="streak"><b>x0</b><span>SERİ</span></div>
  <div id="bottom">
    <div class="panel slot" id="sCore"><b>SİLAH</b><span></span><small></small></div>
    <div class="panel slot" id="sMod"><b>MOD</b><span></span><small></small></div>
    <div class="panel slot" id="sPas"><b>PASİF</b><span></span><small></small></div>
    <div class="panel slot" id="sEcho"><b>REZONANS</b><span></span><small></small></div>
    <div class="panel" id="bars">
      <div class="bar" id="stam"><i></i><span>STAMINA</span></div>
      <div class="bar" id="ult"><i></i><span>ULT [F]</span></div>
      <div id="info"></div>
    </div>
  </div>
  <div id="banner"></div>
  <div id="comboBanner"></div>
  <div id="cross"></div>
  <div id="hm"><i></i><i></i><i></i><i></i></div>
  <div id="popups"></div>
  <div id="overlay"><div class="box" id="ovBox"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
'use strict';
/* ============================================================================
   ALTIGEN REZONANS — tek dosyalık alan savunması prototipi (1 oyuncu + 5 bot)
   Herkesin kendi adası ve kendi çekirdeği var: kimse alanından çıkmaz, herkes kendini savunur.
   Bölümler: 1 Config/Data · 2 Wave Generator · 3 Graphics+Entities (pool) · 4 Feel+SFX
             5 Combat+Combo · 6 Bot AI · 7 Camera/Input · 8 UI/HUD · 9 Game loop
   ========================================================================== */

/* ============================ 1. CONFIG / DATA ============================ */
const CFG = {
  arena:   { coreAl: 40, spawnAl: 110, postAl: 56, laneHalfW: 10, coreR: 3.5 },   // şerit-yerel: al = merkezden uzaklık, la = yanal
  zone:    { aMin: 47, aMax: 76, lat: 8.5 },                 // oyuncunun sabit hareket alanı
  core:    { hp: 30 },                                       // herkesin KENDİ çekirdeği
  rounds:  10, bossRounds: [5, 10], prepTime: 6,
  player:  { walk: 8, sprint: 13, stamina: 100, staminaDrain: 22, staminaRegen: 16 },
  crit:    { chance: 0.12, mult: 2.0 },
  combo:   { window: 2.0, icd: 0.9, splash: 0.7, echoLvl: 0.25 },
  ult:     { need: 100, perKill: 3, streakBonus: 0.03, streakCap: 20, radius: 17, dmg: 170, kb: 7 },
  wave:    { baseCount: 8, countPer: 3, baseHp: 42, hpGrowth: 1.22, spawnWindow: 24, speed: 3.2 },
  flawless:{ dmgPerChain: 0.08, maxChain: 5, extraCards: 1 },
  bot:     { dmgBonus: 1.35, wander: 6 },

  feel:    { streakWindow: 2.6, shakeMax: 0.9, shakeDecay: 2.2, hitstopScale: 0.05, kickDecay: 9,
             trauma: { shot: 0.035, crit: 0.14, kill: 0.1, combo: 0.26, ult: 0.9, leak: 0.7, boss: 1 } },
  pools:   { creeps: 320, proj: 380, fx: 110, rings: 48, beams: 72, debris: 220, popups: 44 },
};

/* Element = kimlik + doğuştan vuruş özelliği (trait). */
const ELEMENTS = {
  FIRE:      { name: 'Ateş',     color: 0xff5a2a, icon: '🔥', tone: 196, trait: { dot: 0.4, dotDur: 2.5 },            tdesc: 'Yakar: 2,5 sn ek hasar' },
  WATER:     { name: 'Su',       color: 0x3aa0ff, icon: '💧', tone: 262, trait: { slow: 0.28, slowDur: 1.3 },         tdesc: 'Yavaşlatır' },
  EARTH:     { name: 'Toprak',   color: 0xd09a4a, icon: '⛰️', tone: 147, trait: { kb: 0.35, stunCh: 0.1, stun: 0.6 }, tdesc: 'İter, %10 sersemletir' },
  AIR:       { name: 'Hava',     color: 0xbdf3f7, icon: '🌪️', tone: 330, trait: { kb: 0.6 },                          tdesc: 'Güçlü geri itme' },
  LIGHTNING: { name: 'Yıldırım', color: 0xffe23a, icon: '⚡', tone: 392, trait: { arcCh: 0.22, arc: 0.6 },            tdesc: '%22 yakındakine sıçrar' },
  POISON:    { name: 'Zehir',    color: 0x7ddc3a, icon: '☠️', tone: 220, trait: { vuln: 2.5 },                        tdesc: 'Hedefi zayıflatır (+%30 hasar alır)' },
};
const EL_KEYS = Object.keys(ELEMENTS);

/* Rezonans komboları: oyuncu draft'tan 2. element (Rezonans slotu) alırsa atışları dönüşümlü gider ve
   2 sn içinde aynı hedefe iki farklı element değince tetiklenir. */
const COMBOS = {
  'FIRE+WATER':       { name: 'Buhar Patlaması', mult: 2.4, aoe: 7 },
  'WATER+LIGHTNING':  { name: 'İletim',          mult: 2.0, chain: 4 },
  'EARTH+AIR':        { name: 'Kum Fırtınası',   mult: 1.6, aoe: 8, slow: 0.55, slowDur: 3.5 },
  'FIRE+POISON':      { name: 'Toksik Alev',     mult: 1.8, dot: 0.9, dotDur: 4 },
  'FIRE+EARTH':       { name: 'Magma',           mult: 2.2, aoe: 5, slow: 0.3, slowDur: 2 },
  'FIRE+AIR':         { name: 'Alev Girdabı',    mult: 2.0, aoe: 9 },
  'FIRE+LIGHTNING':   { name: 'Plazma',          mult: 3.4 },
  'WATER+EARTH':      { name: 'Bataklık',        mult: 1.5, aoe: 6, slow: 0.7, slowDur: 3 },
  'WATER+AIR':        { name: 'Buz Fırtınası',   mult: 1.7, aoe: 5, stun: 1.3 },
  'WATER+POISON':     { name: 'Asit Yağmuru',    mult: 1.6, aoe: 6, vuln: 5 },
  'EARTH+LIGHTNING':  { name: 'Manyetik Şok',    mult: 2.0, stun: 1.6 },
  'EARTH+POISON':     { name: 'Çürüme',          mult: 1.6, dot: 0.6, dotDur: 4, vuln: 4 },
  'AIR+LIGHTNING':    { name: 'Fırtına',         mult: 1.8, chain: 5 },
  'AIR+POISON':       { name: 'Zehir Bulutu',    mult: 1.5, aoe: 8, dot: 0.5, dotDur: 4 },
  'LIGHTNING+POISON': { name: 'Nörotoksin',      mult: 1.9, stun: 1.0, dot: 0.6, dotDur: 3 },
};
const comboKey = (a, b) => EL_KEYS.indexOf(a) < EL_KEYS.indexOf(b) ? a + '+' + b : b + '+' + a;

/* Silah çekirdekleri. kind: proj | beam | chain · kb: vuruş başı geri itme · kbMul: element itmesinin çarpanı */
const CORES = {
  single:  { name: 'Tek Hedef', kind: 'proj',  dmg: 14,  rate: 2.6, range: 29, speed: 78, kb: 0.4,  kbMul: 1,    desc: 'Hızlı, isabetli tek mermi.' },
  arc:     { name: 'Yay AoE',   kind: 'proj',  dmg: 17,  rate: 1.1, range: 27, speed: 44, kb: 1.3,  kbMul: 1.3,  aoe: 5.5, desc: 'Çarptığı yerde patlar (%60 alan hasarı).' },
  beam:    { name: 'Işın',      kind: 'beam',  dmg: 4.2, rate: 9,   range: 25, kb: 0.05, kbMul: 0.12, desc: 'Kesintisiz ışın, çok sık vuruş.' },
  chain:   { name: 'Zincir',    kind: 'chain', dmg: 13,  rate: 1.5, range: 25, kb: 0.3,  kbMul: 0.8,  jumps: 3, falloff: 0.75, jumpR: 10, desc: '3 hedefe sıçrayan şimşek.' },
  scatter: { name: 'Saçma',     kind: 'proj',  dmg: 6,   rate: 1.5, range: 17, speed: 64, kb: 0.55, kbMul: 0.3,  pellets: 6, spread: 0.5, desc: 'Yakın mesafe 6 saçma, sert iter.' },
};
const MODS = {
  pierce:   { name: 'Delici',       pierce: 2, desc: 'Mermi 2 hedefi deler (ışın: hat boyunca, zincir: +sıçrama).' },
  ricochet: { name: 'Sekme',        bounce: 2, desc: 'Vuruş 2 kez yakın hedefe seker.' },
  multi:    { name: 'Çoklu Atış',   extra: 2, extraEff: 0.33, desc: '+2 mermi/hedef (toplam hasar +%65).' },
  dot:      { name: 'Yakıcı (DoT)', dotPct: 0.5, dotDur: 3, desc: '3 sn boyunca vuruşun %50\'si/sn ek hasar.' },
  slow:     { name: 'Dondurucu',    slow: 0.35, slowDur: 1.5, desc: 'Vurulan hedef %35 yavaşlar.' },
  homing:   { name: 'Güdümlü',      turn: 6, rangeMul: 1.2, desc: 'Mermiler hedefi takip eder, menzil +%20.' },
};
const PASSIVES = {
  power:     { name: 'Güç',         dmg: 0.2,  desc: 'Hasar +%20 / sv.' },
  haste:     { name: 'Çabukluk',    rate: 0.18, desc: 'Atış hızı +%18 / sv.' },
  reach:     { name: 'Uzun Menzil', range: 0.2, desc: 'Menzil +%20 / sv.' },
  sharp:     { name: 'Keskin Göz',  crit: 0.1, desc: 'Kritik şansı +%10 / sv.' },
  brutal:    { name: 'Vahşet',      critMult: 0.6, desc: 'Kritik hasarı +%60 / sv.' },
  charger:   { name: 'Şarj',        ult: 0.5, desc: 'Ult dolumu +%50 / sv.' },
  mender:    { name: 'Onarıcı',     mend: 3, desc: 'Her tur sonunda çekirdeğin +3 can / sv.' },
  resonator: { name: 'Rezonatör',   combo: 0.35, desc: 'Kombo hasarı +%35 / sv.' },
  impact:    { name: 'Darbe',       kb: 0.6, desc: 'Geri itme +%60 / sv.' },
};
const LVL = { coreDmg: 0.22, mod: 0.5, modSlow: 0.25 };

const CREEPS = {
  grunt:  { hp: 1,   speed: 1,    leak: 1,  radius: 0.9, ult: 1,  scale: 1,    kb: 1,    eye: 0xff3a8a },
  runner: { hp: 0.6, speed: 1.6,  leak: 1,  radius: 0.8, ult: 1,  scale: 0.85, kb: 1.2,  eye: 0x3affea },
  tank:   { hp: 2.6, speed: 0.7,  leak: 2,  radius: 1.25,ult: 2,  scale: 1.25, kb: 0.45, eye: 0xffa53a },
  boss:   { hp: 12,  speed: 0.5,  leak: 15, radius: 3.0, ult: 14, scale: 3.2,  kb: 0.12, eye: 0xff2a2a },
};

/* ------------------------------ yardımcılar ------------------------------ */
const TAU = Math.PI * 2, SEC = TAU / 6;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const laneAng = i => (i + 0.5) * SEC;
const laneDir = i => [Math.sin(laneAng(i)), Math.cos(laneAng(i))];
function sectorOf(x, z) { let a = Math.atan2(x, z); if (a < 0) a += TAU; return Math.min(5, Math.floor(a / SEC)); }
const hex = c => '#' + c.toString(16).padStart(6, '0');
const QS = new URLSearchParams(location.search);
const AUTO = QS.has('auto');              // ?auto → insan oyuncuyu da bot oynar (denge testi)

const G = {
  state: 'menu', round: 0, time: 0, stateT: 0, waveT: 0,
  roundLeaks: [0, 0, 0, 0, 0, 0], extraCard: false,
  players: [], human: null, creeps: [], projs: [], fxs: [], rings: [], beams: [], debris: [],
  spawnQ: [], pressure: [0, 0, 0, 0, 0, 0], autoFire: true, bloom: true, roundHp: 30,
  stats: { combos: 0, flawless: 0, leaks: 0 },
};

/* ============================ 2. WAVE GENERATOR =========================== */
function genWave(round) {
  const W = CFG.wave, q = [], n = Math.round(W.baseCount + W.countPer * round), boss = CFG.bossRounds.includes(round);
  for (let e = 0; e < 6; e++) {
    for (let i = 0; i < n; i++) {
      const r = Math.random();
      let type = 'grunt';
      if (round >= 3 && r < 0.12 + round * 0.012) type = 'tank';
      else if (round >= 2 && r < 0.4) type = 'runner';
      q.push({ t: 1 + (i / n) * W.spawnWindow * (1 + round * 0.03) + Math.random() * 1.5, lane: e, type });
    }
    if (boss) q.push({ t: 9 + e * 0.4, lane: e, type: 'boss' });     // boss turunda her alana bir boss
  }
  q.sort((a, b) => b.t - a.t);
  return q;
}

/* ======================= 3. GRAPHICS + ENTITIES (POOL) ==================== */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x120e2a, 110, 330);
const camera = new THREE.PerspectiveCamera(62, 1, 0.3, 700);
scene.add(new THREE.HemisphereLight(0x9fb8ff, 0x1a1024, 0.75));
const sun = new THREE.DirectionalLight(0xfff0e0, 0.85); sun.position.set(50, 90, 30); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -85, right: 85, top: 85, bottom: -85, near: 10, far: 220 }); scene.add(sun);

let composer = null, bloomPass = null;
function initPost() {
  if (!THREE.EffectComposer || !THREE.UnrealBloomPass) return;
  try {
    let rt; if (renderer.capabilities.isWebGL2 && THREE.WebGLMultisampleRenderTarget) rt = new THREE.WebGLMultisampleRenderTarget(innerWidth, innerHeight, { format: THREE.RGBAFormat });
    composer = new THREE.EffectComposer(renderer, rt);
    composer.addPass(new THREE.RenderPass(scene, camera));

  portalMat.uniforms.uTime.value = t; motes.position.y = Math.sin(t * 0.3) * 1.5; voidStar.rotation.y += dt * 0.1; voidStar.scale.setScalar(1 + Math.sin(t * 0.8) * 0.06);
}

/* ================================ 8. UI / HUD ============================== */
const $ = id => document.getElementById(id);
const UI = {
  slowT: 0, bannerT: 0, comboT: 0, vigT: 0, popPool: null, pops: [],
  init() {
    const root = $('popups');
    this.popPool = new Pool(CFG.pools.popups, () => { const el = document.createElement('div'); el.className = 'pop'; el.appendChild(document.createElement('span')); root.appendChild(el); return { el }; });
    this.mini = $('mini').getContext('2d');
  },
  slots() {
    const b = G.human.build, set = (id, n, l) => { const e = $(id); e.children[1].textContent = n; e.children[2].textContent = l; };
    set('sCore', CORES[b.core].name, 'Lv ' + b.coreLvl);
    set('sMod', b.mod ? MODS[b.mod].name : '—', b.mod ? 'Lv ' + b.modLvl : 'boş');
    set('sPas', b.passive ? PASSIVES[b.passive].name : '—', b.passive ? 'Lv ' + b.passiveLvl : 'boş');
    set('sEcho', b.echo ? ELEMENTS[b.echo].icon + ' ' + COMBOS[comboKey(G.human.el, b.echo)].name : '—', b.echo ? 'Lv ' + b.echoLvl : 'boş');
  },
  slow() {
    const p = G.human;
    $('roundTxt').textContent = 'TUR ' + G.round + ' / ' + CFG.rounds + (G.state === 'prep' ? '  ·  hazırlık ' + Math.ceil(CFG.prepTime - G.stateT) + ' sn' : '  ·  kalan yaratık ' + (G.creeps.length + G.spawnQ.length));
    $('coreBar').firstElementChild.style.width = (p.core / CFG.core.hp * 100) + '%';
    $('coreBar').lastElementChild.textContent = 'ÇEKİRDEĞİN ' + Math.ceil(p.core) + ' / ' + CFG.core.hp;
    $('chainTxt').textContent = p.chain > 0 ? '★ Kusursuz zincir x' + p.chain + '  →  hasar +%' + Math.round(p.chain * CFG.flawless.dmgPerChain * 100) : '';
    let h = '<h4>SAVUNUCULAR · öldürme · çekirdek</h4>';
    for (const o of G.players) h += '<div class="row' + (o === p ? ' me' : '') + '"' + (o.alive ? '' : ' style="opacity:.4"') + '><span>' + ELEMENTS[o.el].icon + '</span><span>' + o.name + '</span><span>' + o.kills + '</span><span class="pb"><i style="width:' + (o.core / CFG.core.hp * 100) + '%"></i></span><span class="lk">' + (o.alive ? Math.ceil(o.core) : '✖') + '</span></div>';
    $('board').innerHTML = h;
    $('info').innerHTML = 'Krit <b>%' + Math.round(p.stats.crit * 100) + '</b> · Oto [T] ' + (G.autoFire ? 'açık' : 'kapalı') + ' · En iyi seri <b>x' + FEEL.best + '</b>';
    this.drawMini();
  },
  frame(dt) {
    const p = G.human;
    $('stam').firstElementChild.style.width = (p.stamina / CFG.player.stamina * 100) + '%';
    $('ult').firstElementChild.style.width = p.ult + '%'; $('ult').className = 'bar' + (p.ult >= CFG.ult.need ? ' full' : '');
    if ((this.slowT -= dt) <= 0) { this.slowT = 0.2; this.slow(); }
    if (this.bannerT > 0 && (this.bannerT -= dt) <= 0) $('banner').style.opacity = 0;
    if (this.comboT > 0 && (this.comboT -= dt) <= 0) $('comboBanner').style.opacity = 0;
    if (this.vigT > 0 && (this.vigT -= dt) <= 0) $('vig').style.opacity = G.human.core / CFG.core.hp < 0.3 ? 0.35 : 0;
    const W = innerWidth, H = innerHeight;
    for (let i = this.pops.length - 1; i >= 0; i--) {
      const o = this.pops[i]; o.t += dt;
      if (o.t >= o.life) { o.el.style.display = 'none'; this.popPool.put(o); this.pops[i] = this.pops[this.pops.length - 1]; this.pops.pop(); continue; }
      _v.set(o.x + o.dx * o.t, o.y + o.t * 2.6, o.z).project(camera);
      if (_v.z > 1 || _v.z < -1) { o.el.style.opacity = 0; continue; }
      o.el.style.opacity = 1 - (o.t / o.life) ** 3;
      o.el.style.transform = 'translate(' + ((_v.x * 0.5 + 0.5) * W | 0) + 'px,' + ((-_v.y * 0.5 + 0.5) * H | 0) + 'px) translate(-50%,-50%)';
    }
  },
  drawMini() {            // şerit radarı: üstte kapı, altta çekirdeğin, halka = menzilin
    const g = this.mini, W = 170, H = 170, A = CFG.arena, p = G.human, d = p.dir, a0 = A.coreAl - 5, a1 = A.spawnAl + 6, sc = (H - 14) / (a1 - a0);
    const X = la => W / 2 + la * sc, Y = al => H - 7 - (al - a0) * sc, col = hex(ELEMENTS[p.el].color);
    g.clearRect(0, 0, W, H);
    g.beginPath(); g.moveTo(X(-A.laneHalfW), Y(a0)); g.lineTo(X(A.laneHalfW), Y(a0)); g.lineTo(X(A.laneHalfW), Y(a1)); g.lineTo(X(-A.laneHalfW), Y(a1)); g.closePath();
    g.fillStyle = 'rgba(120,150,255,.09)'; g.fill(); g.strokeStyle = col; g.lineWidth = 1.5; g.stroke();
    g.strokeStyle = '#ff3a8a'; g.lineWidth = 3; g.beginPath(); g.moveTo(X(-A.laneHalfW), Y(A.spawnAl + 3)); g.lineTo(X(A.laneHalfW), Y(A.spawnAl + 3)); g.stroke();
    const pal = p.x * d[0] + p.z * d[1], pla = p.x * d[1] - p.z * d[0];
    g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = 1; g.beginPath(); g.arc(X(pla), Y(pal), heroRange(p) * sc, 0, TAU); g.stroke();
    for (const c of G.creeps) { if (!c.active || c.lane !== 0) continue; const s = c.type === 'boss' ? 8 : c.type === 'tank' ? 4 : 3; g.fillStyle = hex(c.T.eye); g.fillRect(X(c.x * d[1] - c.z * d[0]) - s / 2, Y(c.x * d[0] + c.z * d[1]) - s / 2, s, s); }
    g.fillStyle = col; g.beginPath(); g.arc(X(pla), Y(pal), 4.5, 0, TAU); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.stroke();
    g.fillStyle = '#fff'; g.beginPath(); g.moveTo(X(0), Y(A.coreAl) - 6); g.lineTo(X(0) + 5, Y(A.coreAl)); g.lineTo(X(0), Y(A.coreAl) + 6); g.lineTo(X(0) - 5, Y(A.coreAl)); g.closePath(); g.fill();
  },
};
function popup(x, y, z, text, cls) {
  let o = UI.popPool.get();
  if (!o) { if (!cls) return; o = UI.pops.shift(); if (!o) return; }
  o.x = x; o.y = y; o.z = z; o.dx = rand(-1.2, 1.2); o.t = 0; o.life = cls === 'combo' ? 1.2 : cls === 'crit' ? 0.9 : 0.6;
  o.el.firstChild.textContent = text; o.el.className = 'pop ' + (cls || ''); o.el.style.display = 'none'; void o.el.offsetWidth; o.el.style.display = 'block'; o.el.style.opacity = 0; UI.pops.push(o);
}
function feed(html) {
  const f = $('feed'), d = document.createElement('div'); d.innerHTML = html; f.appendChild(d);
  while (f.children.length > 5) f.removeChild(f.firstChild);
  setTimeout(() => { if (d.parentNode) d.parentNode.removeChild(d); }, 7000);
}
function banner(text, color) { const b = $('banner'); b.textContent = text; b.style.color = color || '#fff'; b.style.opacity = 1; UI.bannerT = 2.4; }
function comboBanner(text) { const b = $('comboBanner'); b.textContent = '⟡ ' + text; b.style.opacity = 1; UI.comboT = 0.9; }
function vignette(v) { $('vig').style.opacity = v; UI.vigT = 0.35; }

/* --------------------------------- draft ---------------------------------- */
const SLOT_T = { core: ['SİLAH ÇEKİRDEĞİ', CORES], mod: ['MOD', MODS], passive: ['PASİF', PASSIVES], echo: ['REZONANS ELEMENTİ', ELEMENTS] };
function genCards(p, n) {
  const b = p.build, pool = [], out = [{ slot: 'core', id: b.core }];     // en az bir yükseltme garantili
  for (const s in SLOT_T) for (const id in SLOT_T[s][1]) if (!(s === 'echo' && id === p.el)) pool.push({ slot: s, id });
  shuffle(pool);
  for (const c of pool) { if (out.length >= n) break; if (out.some(o => o.slot === c.slot && o.id === c.id) || (c.slot === 'echo' && out.some(o => o.slot === 'echo'))) continue; out.push(c); }
  return shuffle(out);
}
function applyCard(p, c) { const b = p.build; if (b[c.slot] === c.id) b[c.slot + 'Lvl']++; else b[c.slot] = c.id; calcStats(p); }
function cardText(p, c) {
  if (c.slot !== 'echo') { const d = SLOT_T[c.slot][1][c.id]; return [d.name, d.desc]; }
  const e = ELEMENTS[c.id], cb = COMBOS[comboKey(p.el, c.id)];
  return [e.icon + ' ' + e.name, 'Atışların ' + ELEMENTS[p.el].name + ' / ' + e.name + ' dönüşümlü gider → <b>' + cb.name + '</b> kombosu (x' + cb.mult + '). ' + e.tdesc + '.'];
}
let draftCards = null;
function openDraft() {
  G.state = 'draft'; if (document.exitPointerLock) document.exitPointerLock();
  for (const p of G.players) if (p.isBot && p.alive) botDraft(p);
  if (AUTO) { closeDraft(); return; }
  const n = 3 + (G.extraCard ? CFG.flawless.extraCards : 0), b = G.human.build, mine = G.roundLeaks[0];
  draftCards = genCards(G.human, n);
  let h = '<h1>Tur ' + G.round + ' tamamlandı</h1><p>' + (mine === 0 ? '<b style="color:#ffd76a">KUSURSUZ TUR!</b> Ekstra kart kazandın.' : 'Çekirdeğine ' + mine + ' yaratık ulaştı.') +
    (G.human.chain > 0 ? ' Kusursuz zincir x' + G.human.chain + ' (hasar +%' + Math.round(G.human.chain * CFG.flawless.dmgPerChain * 100) + ').' : '') + '</p><p>Build\'ini güçlendir — bir kart seç (tıkla ya da 1–' + n + '):</p><div class="cards">';
  draftCards.forEach((c, i) => {
    const tx = cardText(G.human, c), cur = b[c.slot], up = cur === c.id;
    h += '<div class="card" data-i="' + i + '"><div class="t">' + SLOT_T[c.slot][0] + '</div><div class="n">' + tx[0] + '</div><div class="d">' + tx[1] + '</div><div class="a">' +
      (up ? 'YÜKSELT → Lv ' + (b[c.slot + 'Lvl'] + 1) : cur ? 'DEĞİŞTİR (seviye korunur)' : 'YENİ') + '</div></div>';
  });
  showOverlay(h + '</div>');
  document.querySelectorAll('.card').forEach(el => el.onclick = () => pickCard(+el.dataset.i));
}
function pickCard(i) { if (G.state !== 'draft' || !draftCards || !draftCards[i]) return; applyCard(G.human, draftCards[i]); draftCards = null; SFX.pick(); closeDraft(); }
function closeDraft() { hideOverlay(); UI.slots(); lockPointer(); startRound(G.round + 1); }
function showOverlay(html) { $('ovBox').innerHTML = html; $('overlay').classList.remove('hide'); }
function hideOverlay() { $('overlay').classList.add('hide'); }

/* =============================== 9. GAME LOOP ============================== */
function startRound(n) {
  G.round = n; G.state = 'prep'; G.stateT = 0; G.roundLeaks.fill(0); G.waveT = 0;
  G.roundHp = CFG.wave.baseHp * Math.pow(CFG.wave.hpGrowth, n - 1);
  G.spawnQ = genWave(n).filter(s => G.players[s.lane].alive);
  const boss = CFG.bossRounds.includes(n);
  banner('TUR ' + n + (boss ? ' — BOSS' : ''), boss ? '#ff6a5a' : '#fff'); SFX.round(); if (boss) SFX.boss();
}
function endRound() {
  const F = CFG.flawless;
  for (const p of G.players) {
    if (!p.alive) continue;
    p.chain = G.roundLeaks[p.id] === 0 ? Math.min(F.maxChain, p.chain + 1) : 0;         // kusursuz zincir kişiseldir
    if (p.stats.mend) p.core = Math.min(CFG.core.hp, p.core + p.stats.mend);
  }
  G.extraCard = G.roundLeaks[0] === 0; if (G.extraCard) G.stats.flawless++;
  if (G.round >= CFG.rounds) return endGame(true);
  openDraft();
}
function endGame(won) {
  G.state = won ? 'won' : 'lost'; if (document.exitPointerLock) document.exitPointerLock();
  const rows = G.players.slice().sort((a, b) => (b.alive - a.alive) || (b.outRound - a.outRound) || (b.kills - a.kills));
  let t = '<table class="end"><tr><th></th><th>Oyuncu</th><th>Öldürme</th><th>Hasar</th><th>Kombo</th><th>Çekirdek</th></tr>';
  rows.forEach((o, i) => t += '<tr class="' + (o === G.human ? 'me' : '') + '"><td>' + (i === 0 ? '👑' : '') + '</td><td>' + ELEMENTS[o.el].icon + ' ' + o.name + '</td><td>' + o.kills + '</td><td>' + Math.round(o.dmgDone) + '</td><td>' + o.combos + '</td><td>' + (o.alive ? Math.ceil(o.core) + ' can' : 'elendi (tur ' + o.outRound + ')') + '</td></tr>');
  showOverlay('<h1 style="color:' + (won ? '#8dffb0' : '#ff6a5a') + '">' + (won ? 'ZAFER — Çekirdeğin ayakta!' : 'ÇEKİRDEĞİN DÜŞTÜ') + '</h1>' +
    '<p>Tur ' + G.round + ' / ' + CFG.rounds + ' · Kusursuz tur: ' + G.stats.flawless + ' · En iyi serin: x' + FEEL.best + '</p>' + t + '</table>' +
    '<button class="go" onclick="location.reload()">Yeniden Oyna</button>');
}
function update(dt) {
  if (G.state !== 'prep' && G.state !== 'wave') return;
  G.time += dt; G.stateT += dt;
  if (G.state === 'prep' && G.stateT >= CFG.prepTime) { G.state = 'wave'; G.stateT = 0; }
  if (G.state === 'wave') { G.waveT += dt; while (G.spawnQ.length && G.spawnQ[G.spawnQ.length - 1].t <= G.waveT) { const s = G.spawnQ.pop(); spawnCreep(s.lane, s.type); } }
  for (const p of G.players) { if (!p.alive) continue; if (p.isBot) updateBot(p, dt); else updateHuman(p, dt); updateHeroCommon(p, dt); }
  Input.actions.length = 0;
  updateProjectiles(dt); updateCreeps(dt); updateFx(dt); updateScenery(dt);
  if (!G.human.alive) return endGame(false);
  if (G.state === 'wave' && !G.spawnQ.length && !G.creeps.length) endRound();
}
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  DesktopSource.poll();
  if (G.state === 'draft') { for (const a of Input.actions) if (a.startsWith('card')) pickCard(+a[4]); Input.actions.length = 0; }
  else if (G.state === 'menu' || G.state === 'won' || G.state === 'lost') Input.actions.length = 0;
  let sdt = dt; if (FEEL.hitstop > 0) { FEEL.hitstop -= dt; sdt = dt * CFG.feel.hitstopScale; }      // hitstop: kısa zaman donması
  update(sdt); FEEL.update(dt);
  if (G.human) { updateCamera(dt); UI.frame(dt); }
  if (composer && G.bloom) composer.render(); else renderer.render(scene, camera);
}
function resize() {
  renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth, innerHeight); }
}
addEventListener('resize', resize);

function init() {
  const els = shuffle(EL_KEYS.slice());                    // rastgele, tekrarsız element dağıtımı
  for (let i = 0; i < 6; i++) G.players.push(makePlayer(i, els[i]));
  G.human = G.players[0]; Cam.yaw = laneAng(0);
  buildArena(); initPost(); UI.init(); UI.slots(); DesktopSource.init(); resize();
  const me = ELEMENTS[G.human.el];
  showOverlay('<h1>ALTIGEN REZONANS</h1><p>Karşıda bir portal açıldı. Metal köprünün bu ucundaki <b>geçidi sen koruyorsun</b>: mühür kristaline ulaşan her yaratık canını azaltır, mührü düşen elenir. Diğer beş savunucu kendi köprüsünde.<br>' +
    'Elementin: <b style="color:' + hex(me.color) + '">' + me.icon + ' ' + me.name + '</b> — ' + me.tdesc + '. Tur aralarında kart seçerek kendi build\'ini kur.</p>' +
    '<div class="keys"><div><b>WASD</b> hareket (köprüdeki beyaz çizginin içinde)</div><div><b>Fare</b> bakış · <b>Shift</b> sprint</div>' +
    '<div><b>Sol tık</b> nişanlı ateş · <b>T</b> oto ateş aç/kapa</div><div><b>Sağ alt</b>: şerit radarı (halka = menzilin)</div>' +
    '<div><b>F</b> Ult — öldürdükçe ve seri yaptıkça dolar</div><div><b>M</b> ses · <b>B</b> ışıma efekti</div>' +
    '<div><b>Kritik</b>: sarı sayı, x2 hasar</div><div><b>Rezonans</b> kartı: 2. element → kombo patlamaları</div></div>' +
    '<button class="go" id="goBtn">BAŞLA</button>');
  $('goBtn').onclick = () => { SFX.init(); hideOverlay(); lockPointer(); startRound(1); };
  if (AUTO) { hideOverlay(); startRound(1); }
  requestAnimationFrame(loop);
}
init();
/* test/denge kancası: ?auto ile aç, konsoldan __sim(saniye) ile hızlı ileri sar */
window.__G = G; window.__CFG = CFG; window.__sim = sec => { for (let t = 0; t < sec && (G.state === 'prep' || G.state === 'wave'); t += 1 / 30) update(1 / 30); return G.state; };
</script>
