<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Altıgen Rezonans</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#07080f;color:#e8eef7;font-family:'Rajdhani',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:500;user-select:none;-webkit-user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;inset:0;pointer-events:none;font-size:14px}
  #roundTxt,#banner,#comboBanner,#streak,.box h1,button.go,.slot b,#board h4{font-family:'Orbitron',system-ui,sans-serif}
  .panel{background:linear-gradient(180deg,rgba(12,18,30,.82),rgba(6,9,16,.82));border:1px solid rgba(90,216,255,.32);border-left:3px solid #5ad8ff;padding:8px 12px;backdrop-filter:blur(3px);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(255,30,40,.55) 100%);opacity:0;transition:opacity .25s}
  #top{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;min-width:340px}
  #roundTxt{font-weight:700;font-size:15px;letter-spacing:.5px}
  #coreBar{position:relative;height:18px;margin:6px 0 4px;background:#161c2b;border-radius:9px;overflow:hidden}
  #coreBar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#39d0ff,#7af7d0);transition:width .2s}
  #coreBar span{position:relative;font-size:12px;font-weight:700;line-height:18px;color:#04121c}
  #chainTxt{font-size:12px;color:#ffd76a;min-height:15px}
  #board{position:absolute;top:10px;left:10px;min-width:250px}
  #board h4{margin:0 0 5px;font-size:11px;letter-spacing:.8px;color:#8fa0ba}
  #board .row{display:grid;grid-template-columns:22px 52px 44px 1fr 34px;align-items:center;gap:5px;margin:3px 0;font-size:12px;font-variant-numeric:tabular-nums}
  #board .row.me{color:#ffd76a;font-weight:700}
  #board .pb{height:7px;background:#161c2b;border-radius:4px;overflow:hidden}
  #board .pb i{display:block;height:100%;background:#39d0ff}
  #board .lk{text-align:right}
  #mini{position:absolute;right:10px;bottom:10px;background:rgba(6,9,16,.8);border:1px solid rgba(90,216,255,.32)}
  #bottom{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:stretch}
  .slot{min-width:108px;text-align:center}
  .slot b{display:block;font-size:10px;color:#8fa0ba;letter-spacing:.6px}
  .slot span{font-size:13px;font-weight:700}
  .slot small{display:block;color:#ffd76a;font-size:10px}
  #bars{min-width:220px}
  .bar{position:relative;height:12px;background:#161c2b;border-radius:6px;overflow:hidden;margin:3px 0}
  .bar i{position:absolute;left:0;top:0;bottom:0;width:0}
  .bar span{position:relative;display:block;font-size:10px;line-height:12px;text-align:center;font-weight:700;text-shadow:0 0 3px #000}
  #stam i{background:#7bd88f}
  #ult i{background:linear-gradient(90deg,#8a5bff,#ff7bd5)}
  #ult.full{box-shadow:0 0 12px #ff7bd5;animation:pulse .7s infinite alternate}
  @keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.6)}}
  #info{font-size:11px;color:#b9c6da;margin-top:3px;white-space:nowrap}
  #info b{color:#fff}
  #feed{position:absolute;left:10px;bottom:10px;width:330px;font-size:12px;line-height:1.5}
  #feed div{background:rgba(9,12,22,.6);padding:1px 6px;border-radius:4px;margin-top:2px;width:fit-content}
  #streak{position:absolute;right:16%;top:38%;text-align:center;font-weight:900;font-style:italic;color:#ffd76a;text-shadow:0 0 12px #f60,0 2px 0 #000;opacity:0;transition:opacity .3s}
  #streak b{display:block;font-size:54px;line-height:1}
  #streak span{font-size:13px;letter-spacing:3px}
  #streak.bump b{animation:bump .18s}
  @keyframes bump{from{transform:scale(1.7) rotate(-6deg)}to{transform:scale(1)}}
  #banner{position:absolute;top:24%;left:0;right:0;text-align:center;font-size:42px;font-weight:900;letter-spacing:3px;text-shadow:0 0 18px #000;opacity:0;transition:opacity .3s}
  #comboBanner{position:absolute;top:62%;left:0;right:0;text-align:center;font-size:26px;font-weight:900;font-style:italic;color:#ffd76a;text-shadow:0 0 12px #f60;opacity:0;transition:opacity .2s}
  #fxv{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 56%,rgba(0,0,0,.62) 100%),repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px)}
  #cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;border:1.5px solid #ff5a3a;box-shadow:0 0 3px #000}
  #cross.locked{width:38px;height:38px;margin:-19px;border:2px dashed #ff3a2a;box-shadow:0 0 10px rgba(255,60,40,.7);animation:lk 2.4s linear infinite}
  @keyframes lk{to{transform:rotate(360deg)}}
  #hm{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
  #hm i{position:absolute;width:11px;height:2.5px;background:#fff;border-radius:2px;box-shadow:0 0 4px #000}
  #hm i:nth-child(1){transform:translate(7px,-12px) rotate(-45deg)}#hm i:nth-child(2){transform:translate(-18px,-12px) rotate(45deg)}
  #hm i:nth-child(3){transform:translate(7px,10px) rotate(45deg)}#hm i:nth-child(4){transform:translate(-18px,10px) rotate(-45deg)}
  #hm.on{animation:hm .16s ease-out}#hm.crit i{background:#ffd23a}#hm.kill i{background:#ff4a4a;width:14px}
  @keyframes hm{from{opacity:1;transform:scale(1.5)}to{opacity:0;transform:scale(.9)}}
  #popups{position:absolute;inset:0;overflow:hidden}
  .pop{position:absolute;left:0;top:0;display:none;will-change:transform,opacity}
  .pop span{display:block;font-weight:900;font-size:14px;text-shadow:0 0 3px #000,0 1px 2px #000;white-space:nowrap;animation:popin .14s ease-out}
  .pop.crit span{color:#ffd23a;font-size:22px;font-style:italic}.pop.combo span{color:#ff9d3a;font-size:19px;font-style:italic}
  @keyframes popin{from{transform:scale(2.1)}to{transform:scale(1)}}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(8,14,26,.88),rgba(2,3,6,.95));pointer-events:auto}
  #overlay.hide{display:none}
  .box{max-width:1000px;width:94%;text-align:center;max-height:100%;overflow-y:auto;padding:14px 0}
  .box h1{margin:0 0 6px;font-size:32px;letter-spacing:3px;color:#5ad8ff;text-shadow:0 0 18px rgba(90,216,255,.5)}
  .box p{color:#b9c6da;line-height:1.55;margin:6px 0}
  .keys{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 18px;text-align:left;margin:14px auto;max-width:600px;font-size:13px}
  .keys b{color:#ffd76a}
  button.go{pointer-events:auto;margin-top:12px;padding:12px 38px;font-size:16px;font-weight:800;letter-spacing:2px;border:0;background:#5ad8ff;color:#04121c;cursor:pointer;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
  .cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .card{--c:#5ad8ff;position:relative;display:flex;flex-direction:column;width:208px;padding:0 0 12px;background:linear-gradient(180deg,#141b2c,#0a0e18);border:1px solid var(--c);cursor:pointer;text-align:left;transition:transform .14s,background .14s,filter .14s;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));animation:cardin .35s backwards}
  .card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}.card:nth-child(4){animation-delay:.21s}
  @keyframes cardin{from{opacity:0;transform:translateY(28px) scale(.94)}}
  .card:hover{transform:translateY(-8px) scale(1.04);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 26%,#141b2c),#0a0e18);filter:brightness(1.12)}
  .card .hd{display:flex;justify-content:space-between;align-items:center;padding:6px 20px 6px 10px;background:color-mix(in srgb,var(--c) 22%,transparent);font-size:11px;letter-spacing:1.5px;color:var(--c);font-weight:700}
  .card .key{border:1px solid var(--c);padding:0 6px;border-radius:3px}
  .card .ic{font-size:40px;line-height:1.1;text-align:center;margin:12px 0 2px;color:var(--c);filter:drop-shadow(0 0 10px var(--c))}
  .card .n{font-family:'Orbitron',system-ui,sans-serif;font-size:15px;font-weight:800;text-align:center;margin:4px 8px 2px}
  .card .pips{text-align:center;color:var(--c);letter-spacing:2px;font-size:11px;margin:3px 0 8px;white-space:pre}.card .pips i{font-style:normal;color:#fff}
  .card .d{font-size:13px;color:#b9c6da;min-height:56px;padding:0 12px 8px;line-height:1.35;flex:1}
  .card .st:last-of-type{margin-bottom:9px}
  .card .st{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 12px;border-top:1px solid rgba(255,255,255,.08);font-variant-numeric:tabular-nums}
  .card .st span{color:#8fa0ba}.card .st b{color:#cfd8e6;white-space:nowrap}.card .st b i{font-style:normal;color:#8dffb0}
  .card .a{margin:auto 12px 0 22px;padding:4px;text-align:center;font-size:11px;font-weight:800;letter-spacing:.8px;color:#06101a;background:var(--c)}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}.chip{font-size:12px;padding:3px 10px;border:1px solid rgba(90,216,255,.3);color:#8fa0ba;letter-spacing:.5px}.chip b{color:#fff}
  button.re{pointer-events:auto;margin-top:16px;padding:7px 20px;background:transparent;border:1px solid #5ad8ff;color:#5ad8ff;font:inherit;font-weight:700;letter-spacing:1px;cursor:pointer}button.re:hover:not(:disabled){background:rgba(90,216,255,.15)}button.re:disabled{opacity:.35;cursor:default}
  table.end{margin:12px auto;border-collapse:collapse;font-variant-numeric:tabular-nums}
  table.end td,table.end th{padding:4px 14px;font-size:13px}table.end tr.me td{color:#ffd76a;font-weight:700}
  @media (max-width:900px){#board{transform:scale(.8);transform-origin:top left}#feed{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="fxv"></div>
  <div id="vig"></div>
  <div id="top" class="panel"><div id="roundTxt">—</div><div id="coreBar"><i></i><span></span></div><div id="chainTxt"></div></div>
  <div id="board" class="panel"></div>
  <canvas id="mini" width="170" height="170"></canvas>
  <div id="feed"></div>
  <div id="streak"><b>x0</b><span>SERİ</span></div>
  <div id="bottom">
    <div class="panel slot" id="sCore"><b>SİLAH</b><span></span><small></small></div>
    <div class="panel slot" id="sMod"><b>MOD</b><span></span><small></small></div>
    <div class="panel slot" id="sPas"><b>PASİF</b><span></span><small></small></div>
    <div class="panel slot" id="sEcho"><b>REZONANS</b><span></span><small></small></div>
    <div class="panel" id="bars">
      <div class="bar" id="stam"><i></i><span>STAMINA</span></div>
      <div class="bar" id="ult"><i></i><span>ULT [F]</span></div>
      <div id="info"></div>
    </div>
  </div>
  <div id="banner"></div>
  <div id="comboBanner"></div>
  <div id="cross"></div>
  <div id="hm"><i></i><i></i><i></i><i></i></div>
  <div id="popups"></div>
  <div id="overlay"><div class="box" id="ovBox"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
'use strict';
/* ============================================================================
   ALTIGEN REZONANS — tek dosyalık alan savunması prototipi (1 oyuncu + 5 bot)
   Herkesin kendi adası ve kendi çekirdeği var: kimse alanından çıkmaz, herkes kendini savunur.
   Bölümler: 1 Config/Data · 2 Wave Generator · 3 Graphics+Entities (pool) · 4 Feel+SFX
             5 Combat+Combo · 6 Bot AI · 7 Camera/Input · 8 UI/HUD · 9 Game loop
   ========================================================================== */

/* ============================ 1. CONFIG / DATA ============================ */
const CFG = {
  arena:   { coreAl: 40, spawnAl: 110, postAl: 56, laneHalfW: 8.5, coreR: 3.2 },   // şerit-yerel: al = merkezden uzaklık, la = yanal
  zone:    { aMin: 47, aMax: 76, lat: 7 },                 // oyuncunun sabit hareket alanı
  core:    { hp: 30 },                                       // herkesin KENDİ çekirdeği
  rounds:  20, bossRounds: [5, 10, 15, 20], prepTime: 5,
  player:  { walk: 8, sprint: 13, stamina: 100, staminaDrain: 22, staminaRegen: 16 },
  crit:    { chance: 0.12, mult: 2.0 },
  target:  { danger: 12 },                                  // bu mesafeden yakına giren yaratık her zaman ilk hedef
  combo:   { window: 2.0, icd: 0.9, splash: 0.7, echoLvl: 0.25 },
  ult:     { need: 100, perKill: 3, streakBonus: 0.03, streakCap: 20, radius: 17, dmg: 170, kb: 7 },
  wave:    { baseCount: 8, countPer: 2, baseHp: 42, hpGrowth: 1.15, spawnWindow: 24, speed: 3.2 },
  flawless:{ dmgPerChain: 0.08, maxChain: 5, extraCards: 1 },
  bot:     { dmgBonus: 1.35, wander: 5 },

  feel:    { streakWindow: 2.6, shakeMax: 0.9, shakeDecay: 2.2, hitstopScale: 0.05, kickDecay: 9,
             streakShake: { from: 5, cap: 30, floor: 0.24, bonus: 1.1 },   // seri büyüdükçe sürekli titreşim (tavanlı)
             trauma: { shot: 0.035, crit: 0.14, kill: 0.1, combo: 0.26, ult: 0.9, leak: 0.7, boss: 1 } },
  pools:   { creeps: 320, proj: 380, fx: 110, rings: 48, beams: 72, debris: 460, popups: 44 },
};

/* Element = kimlik + doğuştan vuruş özelliği (trait). */
const ELEMENTS = {
  FIRE:      { name: 'Ateş',     color: 0xff5a2a, icon: '🔥', tone: 196, trait: { dot: 0.4, dotDur: 2.5 },            tdesc: 'Yakar: 2,5 sn ek hasar' },
  WATER:     { name: 'Su',       color: 0x3aa0ff, icon: '💧', tone: 262, trait: { slow: 0.28, slowDur: 1.3 },         tdesc: 'Yavaşlatır' },
  EARTH:     { name: 'Toprak',   color: 0xd09a4a, icon: '⛰️', tone: 147, trait: { kb: 0.35, stunCh: 0.1, stun: 0.6 }, tdesc: 'İter, %10 sersemletir' },
  AIR:       { name: 'Hava',     color: 0xbdf3f7, icon: '🌪️', tone: 330, trait: { kb: 0.6 },                          tdesc: 'Güçlü geri itme' },
  LIGHTNING: { name: 'Yıldırım', color: 0xffe23a, icon: '⚡', tone: 392, trait: { arcCh: 0.22, arc: 0.6 },            tdesc: '%22 yakındakine sıçrar' },
  POISON:    { name: 'Zehir',    color: 0x7ddc3a, icon: '☠️', tone: 220, trait: { vuln: 2.5 },                        tdesc: 'Hedefi zayıflatır (+%30 hasar alır)' },
};
const EL_KEYS = Object.keys(ELEMENTS);

/* Rezonans komboları: oyuncu draft'tan 2. element (Rezonans slotu) alırsa atışları dönüşümlü gider ve
   2 sn içinde aynı hedefe iki farklı element değince tetiklenir. */
const COMBOS = {
  'FIRE+WATER':       { name: 'Buhar Patlaması', mult: 2.4, aoe: 7 },
  'WATER+LIGHTNING':  { name: 'İletim',          mult: 2.0, chain: 4 },
  'EARTH+AIR':        { name: 'Kum Fırtınası',   mult: 1.6, aoe: 8, slow: 0.55, slowDur: 3.5 },
  'FIRE+POISON':      { name: 'Toksik Alev',     mult: 1.8, dot: 0.9, dotDur: 4 },
  'FIRE+EARTH':       { name: 'Magma',           mult: 2.2, aoe: 5, slow: 0.3, slowDur: 2 },
  'FIRE+AIR':         { name: 'Alev Girdabı',    mult: 2.0, aoe: 9 },
  'FIRE+LIGHTNING':   { name: 'Plazma',          mult: 3.4 },
  'WATER+EARTH':      { name: 'Bataklık',        mult: 1.5, aoe: 6, slow: 0.7, slowDur: 3 },
  'WATER+AIR':        { name: 'Buz Fırtınası',   mult: 1.7, aoe: 5, stun: 1.3 },
  'WATER+POISON':     { name: 'Asit Yağmuru',    mult: 1.6, aoe: 6, vuln: 5 },
  'EARTH+LIGHTNING':  { name: 'Manyetik Şok',    mult: 2.0, stun: 1.6 },
  'EARTH+POISON':     { name: 'Çürüme',          mult: 1.6, dot: 0.6, dotDur: 4, vuln: 4 },
  'AIR+LIGHTNING':    { name: 'Fırtına',         mult: 1.8, chain: 5 },
  'AIR+POISON':       { name: 'Zehir Bulutu',    mult: 1.5, aoe: 8, dot: 0.5, dotDur: 4 },
  'LIGHTNING+POISON': { name: 'Nörotoksin',      mult: 1.9, stun: 1.0, dot: 0.6, dotDur: 3 },
};
const comboKey = (a, b) => EL_KEYS.indexOf(a) < EL_KEYS.indexOf(b) ? a + '+' + b : b + '+' + a;

/* Silah çekirdekleri. kind: proj | beam | chain · kb: vuruş başı geri itme · kbMul: element itmesinin çarpanı */
const CORES = {
  single:  { name: 'Tek Hedef', kind: 'proj',  dmg: 14,  rate: 2.6, range: 29, speed: 78, kb: 0.4,  kbMul: 1,    desc: 'Hızlı, isabetli tek mermi.' },
  arc:     { name: 'Yay AoE',   kind: 'proj',  dmg: 17,  rate: 1.1, range: 27, speed: 44, kb: 1.3,  kbMul: 1.3,  aoe: 5.5, desc: 'Çarptığı yerde patlar (%60 alan hasarı).' },
  beam:    { name: 'Işın',      kind: 'beam',  dmg: 4.2, rate: 9,   range: 25, kb: 0.05, kbMul: 0.12, desc: 'Kesintisiz ışın, çok sık vuruş.' },
  chain:   { name: 'Zincir',    kind: 'chain', dmg: 13,  rate: 1.5, range: 25, kb: 0.3,  kbMul: 0.8,  jumps: 3, falloff: 0.75, jumpR: 10, desc: '3 hedefe sıçrayan şimşek.' },
  scatter: { name: 'Saçma',     kind: 'proj',  dmg: 6,   rate: 1.5, range: 17, speed: 64, kb: 0.55, kbMul: 0.3,  pellets: 6, spread: 0.5, desc: 'Yakın mesafe 6 saçma, sert iter.' },
};
const MODS = {
  pierce:   { name: 'Delici',       pierce: 2, desc: 'Mermi 2 hedefi deler (ışın: hat boyunca, zincir: +sıçrama).' },
  ricochet: { name: 'Sekme',        bounce: 2, desc: 'Vuruş 2 kez yakın hedefe seker.' },
  multi:    { name: 'Çoklu Atış',   extra: 2, extraEff: 0.33, desc: '+2 mermi/hedef (toplam hasar +%65).' },
  dot:      { name: 'Yakıcı (DoT)', dotPct: 0.5, dotDur: 3, desc: '3 sn boyunca vuruşun %50\'si/sn ek hasar.' },
  slow:     { name: 'Dondurucu',    slow: 0.35, slowDur: 1.5, desc: 'Vurulan hedef %35 yavaşlar.' },
  homing:   { name: 'Güdümlü',      turn: 6, rangeMul: 1.2, desc: 'Mermiler hedefi takip eder, menzil +%20.' },
};
const PASSIVES = {
  power:     { name: 'Güç',         dmg: 0.2,  desc: 'Hasar +%20 / sv.' },
  haste:     { name: 'Çabukluk',    rate: 0.18, desc: 'Atış hızı +%18 / sv.' },
  reach:     { name: 'Uzun Menzil', range: 0.2, desc: 'Menzil +%20 / sv.' },
  sharp:     { name: 'Keskin Göz',  crit: 0.1, desc: 'Kritik şansı +%10 / sv.' },
  brutal:    { name: 'Vahşet',      critMult: 0.6, desc: 'Kritik hasarı +%60 / sv.' },
  charger:   { name: 'Şarj',        ult: 0.5, desc: 'Ult dolumu +%50 / sv.' },
  mender:    { name: 'Onarıcı',     mend: 3, desc: 'Her tur sonunda çekirdeğin +3 can / sv.' },
  resonator: { name: 'Rezonatör',   combo: 0.35, desc: 'Kombo hasarı +%35 / sv.' },
  impact:    { name: 'Darbe',       kb: 0.6, desc: 'Geri itme +%60 / sv.' },
};
const LVL = { coreDmg: 0.22, mod: 0.5, modSlow: 0.25 };

const CREEPS = {

function genWave(round) {
  const W = CFG.wave, q = [], n = Math.round(W.baseCount + W.countPer * round), boss = CFG.bossRounds.includes(round);
  for (let e = 0; e < 6; e++) {
    for (let i = 0; i < n; i++) {
      const r = Math.random();
      let type = 'grunt';
      if (round >= 3 && r < 0.12 + round * 0.012) type = 'tank';
      else if (round >= 2 && r < 0.4) type = 'runner';
      q.push({ t: 1 + (i / n) * W.spawnWindow * (1 + round * 0.03) + Math.random() * 1.5, lane: e, type });
    }
    if (boss) q.push({ t: 9 + e * 0.4, lane: e, type: 'boss' });     // boss turunda her alana bir boss
  }
  q.sort((a, b) => b.t - a.t);
  return q;
}

  updateProjectiles(dt); updateCreeps(dt); FXOFF = false; updateFx(dt); updateScenery(dt);
  if (!G.human.alive) return endGame(false);
  if (G.state === 'wave' && !G.spawnQ.length && !G.creeps.length) endRound();
}
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  DesktopSource.poll();
  if (G.state === 'draft') { for (const a of Input.actions) if (a.startsWith('card')) pickCard(+a[4]); Input.actions.length = 0; }
  else if (G.state === 'menu' || G.state === 'won' || G.state === 'lost') Input.actions.length = 0;
  let sdt = dt; if (FEEL.hitstop > 0) { FEEL.hitstop -= dt; sdt = dt * CFG.feel.hitstopScale; }      // hitstop: kısa zaman donması
  for (let i = 0; i < G.speed; i++) update(sdt);            // hızlandırma: aynı karede birden çok sim adımı
  FEEL.update(dt);
  if (G.human) { updateCamera(dt); UI.frame(dt); }
  if (composer && G.bloom) composer.render(); else renderer.render(scene, camera);
}
function resize() {
  renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth, innerHeight); }
}
addEventListener('resize', resize);

function init() {
  const els = shuffle(EL_KEYS.slice());                    // rastgele, tekrarsız element dağıtımı
  for (let i = 0; i < 6; i++) G.players.push(makePlayer(i, els[i]));
  G.human = G.players[0]; Cam.yaw = laneAng(0);
  buildArena(); initPost(); UI.init(); UI.slots(); DesktopSource.init(); resize();
  const me = ELEMENTS[G.human.el];
  showOverlay('<h1>ALTIGEN REZONANS</h1><p>İstasyonun gövdesi yarıldı; koridorun ucunda bir kara delik açık. Sen bir savaş androidisin ve koridorun bu ucundaki <b>geçidi koruyorsun</b>: mühür kristaline ulaşan her yaratık canını azaltır, mührü düşen elenir. 20 tur dayan.<br>' +
    'Elementin: <b style="color:' + hex(me.color) + '">' + me.icon + ' ' + me.name + '</b> — ' + me.tdesc + '. Tur aralarında kart seçerek kendi build\'ini kur.</p>' +
    '<div class="keys"><div><b>WASD</b> hareket (geçidin önündeki alanda)</div><div><b>Fare</b> bakış · <b>Shift</b> sprint</div>' +
    '<div><b>Kilit</b>: nişangâh hedefe kendi kilitlenir · <b>Sol tık</b> kilitten çık, serbest nişan · <b>Sağ tık / T</b> yeniden kilitlen</div><div><b>Sağ alt</b>: şerit radarı (halka = menzilin)</div>' +
    '<div><b>F</b> Ult — öldürdükçe ve seri yaptıkça dolar</div><div><b>G</b> oyun hızı · <b>[ ]</b> görüş açısı · <b>M</b> ses · <b>B</b> ışıma</div>' +
    '<div><b>Kritik</b>: sarı sayı, x2 hasar</div><div><b>Rezonans</b> kartı: 2. element → kombo patlamaları</div></div>' +
    '<button class="go" id="goBtn">BAŞLA</button>');
  $('goBtn').onclick = () => { SFX.init(); hideOverlay(); lockPointer(); startRound(1); };
  if (AUTO) { hideOverlay(); startRound(1); }
  requestAnimationFrame(loop);
}
init();
/* test/denge kancası: ?auto ile aç, konsoldan __sim(saniye) ile hızlı ileri sar */
window.__G = G; window.__CFG = CFG; window.__sim = sec => { for (let t = 0; t < sec && (G.state === 'prep' || G.state === 'wave'); t += 1 / 30) update(1 / 30); return G.state; };
</script>
